      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/TrackStatus' }
        - name: singerId
          in: query
          schema: { type: string, format: uuid }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: 曲目列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/TrackSummary' }
                      pagination: { $ref: '#/components/schemas/PaginationMeta' }

  /tracks/generate:
    post:
      tags: [tracks]
      operationId: generateTrack
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TrackGenerationRequest' }
      responses:
        '202':
          description: 任务已创建，轮询job_id
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AsyncJobStarted' }
        '402':
          description: 积分不足
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /tracks/generate/{jobId}:
    get:
      tags: [tracks]
      operationId: getTrackGenerationStatus
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 任务状态
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/TrackGenerationResponse' }

  /tracks/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [tracks]
      operationId: getTrack
      responses:
        '200':
          description: 曲目详情（含歌词）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Track' }
    patch:
      tags: [tracks]
      operationId: updateTrack
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:    { type: string }
                coverUrl: { type: string, format: uri }
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Track' }
