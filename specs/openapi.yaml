  /admin/notifications/read-all:
    post: { tags: [admin-notifications], operationId: adminMarkAllNotificationsRead, responses: { '200': { description: 'ok（{updated: n}）' } } }

  # ── 用户账号管理（v0.59 backfill + 停用 / 恢复链路） ────────────────────────
  /admin/users:
