    put:    { tags: [admin-agent-bots], operationId: adminUpdateAgentBot, responses: { '200': { description: ok } } }
    delete: { tags: [admin-agent-bots], operationId: adminDeleteAgentBot, responses: { '204': { description: ok } } }

  # ── Prompt 模板管理（v0.40 新增；素材运营文本三件 system+user 模板，DB 真源可改/灰度/回滚） ──────────
  /admin/prompts:
    get: { tags: [admin-prompts], operationId: adminListPrompts, responses: { '200': { description: prompt_template 列表（含未落库但有 resource 默认的已知 key） } } }
  /admin/prompts/{key}:
    parameters: [{ name: key, in: path, required: true, schema: { type: string } }]
    get: { tags: [admin-prompts], operationId: adminGetPrompt,    responses: { '200': { description: ok } } }
    put: { tags: [admin-prompts], operationId: adminUpsertPrompt, responses: { '200': { description: upsert（version 自增，1min 缓存立即失效） } } }
  /admin/prompts/{key}/dry-run:
    parameters: [{ name: key, in: path, required: true, schema: { type: string } }]
    post: { tags: [admin-prompts], operationId: adminDryRunPrompt, responses: { '200': { description: 用样例参数 fill 出最终 messages（不真调模型），返回变量列表与缺失变量 } } }
  /admin/prompts/{key}/test-run:
    parameters: [{ name: key, in: path, required: true, schema: { type: string } }]
    post: { tags: [admin-prompts], operationId: adminTestRunPrompt, responses: { '200': { description: 用样例参数填充后真实调用一次模型，返回输出与 token 用量 } } }
  /admin/prompts/{key}/versions:
    parameters: [{ name: key, in: path, required: true, schema: { type: string } }]
    get: { tags: [admin-prompts], operationId: adminListPromptVersions, responses: { '200': { description: prompt_template_version 快照列表 } } }
  /admin/prompts/{key}/versions/{version}/rollback:
    parameters:
      - { name: key, in: path, required: true, schema: { type: string } }
      - { name: version, in: path, required: true, schema: { type: integer } }
    post: { tags: [admin-prompts], operationId: adminRollbackPromptVersion, responses: { '200': { description: 回滚到历史版本，并追加一个新的当前版本快照 } } }


  # ── 素材运营 · 文本类 AI（v0.40 新增；接真 LLM，失败降级，见 MaterialAiService） ──────────
  /material/scripts:
    get: { tags: [material], operationId: materialListScripts, responses: { '200': { description: '当前用户可见 ScriptAsset[]（过滤 deleted_at）' } } }
    post: { tags: [material], operationId: materialSaveScript, responses: { '200': { description: 保存脚本 ScriptAsset } } }
  /material/scripts/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    get: { tags: [material], operationId: materialGetScript, responses: { '200': { description: 单个脚本 ScriptAsset；已软删/无权访问返回 null } } }
    delete: { tags: [material], operationId: materialDeleteScript, responses: { '204': { description: 软删除脚本（写 deleted_at，不物理删除） } } }
  /material/scripts/ai-draft:
    post:
      tags: [material]
      operationId: materialAiDraftScripts
      description: >-
        AI 起稿候选 ScriptAsset[]（不落库）。v0.132：目标时长对齐视频模型能力——
        duration_sec 缺省时取默认视频端点有效上限（无配置回退 15s）；显式传入且越界 →
        400 VIDEO_DURATION_UNSUPPORTED（不静默 clamp）。无 product_id 时可传 creative_brief
        （免商品脚本主题简介）。产物严格校验（Σdur ≤ 目标 / ≥ 有效下限 / 逐镜口播 ≤ dur×8 字），
        首轮全不合法自动重试一次，仍不合法 → 502 AI_BAD_OUTPUT 且释放冻结（不扣费）。
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                product_id: { type: string }
                product_name: { type: string }
                category: { type: string }
                selling_points: { type: string }
                creative_brief: { type: string, description: 免商品起稿的主题/卖点简介 }
                tone: { type: string }
                audience: { type: array, items: { type: string } }
                duration_sec: { type: integer, description: 目标时长（秒）；缺省取默认视频端点有效上限 }
                count: { type: integer, minimum: 1, maximum: 5 }
      responses:
        '200': { description: 'AI 起稿候选 ScriptAsset[]（不落库）' }
        '400': { description: VIDEO_DURATION_UNSUPPORTED（显式目标时长越出默认视频模型有效区间） }
        '502': { description: AI_BAD_OUTPUT（重试一次后仍无符合时长约束的产物；不扣费） }
        '503': { description: AI_NOT_CONFIGURED / PROMPT_NOT_CONFIGURED }
  /material/scripts/{id}/variables:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post: { tags: [material], operationId: materialExtractVariables, responses: { '200': { description: '脚本可替换变量 ScriptVariable[]（已过滤幻觉；失败/无权访问返回空，前端用正则兜底）' } } }

  # ── 素材运营 · 带货视频生成（v0.41 新增；真实视频大模型 · 异步 submit + 轮询，见 MaterialVideoJobService） ──
  /material/videos/models:
    get:
      tags: [material]
      operationId: materialListVideoModels
      description: >-
        「生成模型」候选（v0.132）：启用候选 × 启用端点 + capability + 单价 + 服务端算好的
        有效时长区间（= 供应商协议硬边界 ∩ candidate.maxDurationSec；null=该侧无已知硬边界）。
        默认 binding 存在但无 candidate 行时合成一条默认项（capability=null）。前端据此做
        提交前时长校验与实时报价；接口失败时前端必须禁用提交，不得回落写死单价。
      responses:
        '200':
          description: MaterialVideoModelsDto
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      video:
                        type: array
                        items: { $ref: '#/components/schemas/VideoModelOption' }
  /material/videos/generate:
    post:
      tags: [material]
      operationId: materialGenerateVideos
      description: >-
        提交一批生成任务 → 返回任务卡 MaterialVideo[]（status=rendering）。
        v0.132 时长策略：items[].duration_sec 必填且 >0（否则 400 VIDEO_DURATION_REQUIRED）；
        必须落在所选端点有效时长区间内（协议硬边界 ∩ capability.maxDurationSec，否则
        400 VIDEO_DURATION_UNSUPPORTED）。全部校验发生在任何积分冻结之前——批内任一非法 →
        整批无任务、无冻结。items[].variant_config.endpoint_id 可选：显式选非默认候选模型
        （白名单未命中 → 503 ENDPOINT_NOT_ALLOWED）；缺省走默认端点。计价优先级：
        candidate.creditCostOverride（PER_SECOND 按秒展开）> 带货线默认单价；外部请求体的
        credit_cost/credit_label 一律被服务端剥离（防零价绕过）。
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    required: [script_id, name, kind, prompt, duration_sec]
                    properties:
                      script_id: { type: string }
                      product_id: { type: string }
                      name: { type: string }
                      kind: { type: string, enum: [baseline, variant] }
                      parent_video_id: { type: string, nullable: true }
                      prompt: { type: string }
                      variant_config:
                        type: object
                        description: 6 轴画面维度 + 可选 endpoint_id（显式选模型）
                      duration_sec: { type: integer, minimum: 1 }
                      aspect_ratio: { type: string }
      responses:
        '200': { description: '任务卡 MaterialVideo[]（status=rendering）' }
        '400': { description: VIDEO_DURATION_REQUIRED / VIDEO_DURATION_UNSUPPORTED / VIDEO_PRICE_OVERFLOW }
        '402': { description: 积分余额不足（整批回滚，无任务无冻结） }
        '503': { description: VIDEO_NOT_CONFIGURED / ENDPOINT_NOT_ALLOWED }
  /material/videos/jobs:
    get:
      tags: [material]
      operationId: materialListVideoJobs
      parameters:
        - { in: query, name: script_id, schema: { type: string } }
        - { in: query, name: product_id, schema: { type: string } }
      responses: { '200': { description: '当前用户的视频生成任务 MaterialVideo[]（含 rendering/ready/failed）' } }
  /material/videos/jobs/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    get: { tags: [material], operationId: materialGetVideoJob, responses: { '200': { description: 单个生成任务的最新状态 / 结果 MaterialVideo（前端独立轮询；非本人返回 null） } } }
  /material/viral-hits:
    get: { tags: [material], operationId: materialListViralHits, responses: { '200': { description: '用户主动提交链接后的历史爆款分析结果 ViralHit[]（不自动抓取平台列表）' } } }
  /material/viral-hits/analyze-url:
    post: { tags: [material], operationId: materialAnalyzeViralUrl, responses: { '200': { description: '提交单条视频链接 → 解析可用 video_url → AI 拆解 ViralHit；body={url, platform?}' } } }

  # ── admin · products（商品库管理；v0.31 起承载所有写动作） ───────────────────────

  /admin/products:
