                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Product' }
    post:
      tags: [admin-products]
      operationId: adminCreateProduct
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses:
        '201':
          description: created
