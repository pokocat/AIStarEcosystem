                currentPassword: { type: string, description: 已有密码时必填 }
                newPassword: { type: string, minLength: 6 }
      responses:
        '200': { description: ok }
        '400': { description: 新密码缺失 / 太短 / 未填写当前密码 }
        '403': { description: 当前密码错误 }

  /me/wallet:
    get:
