        avatar:         { type: string }
        cover:          { type: string }
        category:       { $ref: '#/components/schemas/CelebrityCategory' }
        subCategories:
          type: array
          items: { $ref: '#/components/schemas/CelebrityCategory' }
        isHot:          { type: boolean }
        description:    { type: string }
        startingPrice:  { type: string, description: '"¥299起"' }
        pricingTier:    { $ref: '#/components/schemas/CelebrityPricingTierName' }
        quotaUsed:      { type: integer }
        quotaTotal:     { type: integer }
        authorization:  { $ref: '#/components/schemas/CelebrityAuthorization' }
