  # ── v0.65 短剧渲染（分镜首帧图像 + 直出/动态视频）。DramaRenderController。 ──
  /me/drama/render/models:
    get: { tags: [drama], operationId: listDramaRenderModels, summary: 'D-11 出片模型下拉：{ image:[...], video:[...] }，每项 { endpointId, name, isDefault, capability{maxRefImages,supportsFirstLastFrame,supportsSubjectReference,maxDurationSec}, creditCost, billingUnit(per_call|per_second) }。仅含启用候选 + 启用端点；capability 未配置（null）时服务端装配按 legacy 兼容默认（maxRefImages→6=v0.97 前端既有上限、首尾帧→协议关键字静态判定；显式配置最高优先）。视频端点 billingMode=PER_SECOND 且候选有 override 时，creditCost 表示每秒费率，实际 hold=费率×时长。前端默认选 isDefault 项。', responses: { '200': { description: ok } } }
  /me/drama/render/frame:
    post: { tags: [drama], operationId: renderDramaFrame, summary: '分镜首帧渲染（IMAGE_GENERATION 图像模型 → CDN，按次扣积分）。v0.72 起 body={kind?(shot|short|scene|character),vars{},ratio?,count?,ref_images?}：出图提示词模板服务端化（shot→drama.frame_image / short→drama.short_frame_image / v0.98 scene→drama.scene_frame_image 空景场景参考图 / character→drama.character_frame_image 角色定妆参考图），前端传 vars 填充。C-1（一致性引擎）起返回体加 applied_refs（实际生效参考清单 + 过滤原因：local_unfetchable 等），前端「参考 N/M 生效」回报。C-3 起服务端参考装配：body 可传 shot_ref{project_id?,episode_no,scene_id,shot_id,chain_consistency}（服务端按 payloadJson + drama_character/scene 实体自装配角色/场景/上一镜真实末帧）/ ref_slots{character_refs,scene_ref,prev_last_frame}（前端显式槽位，短视频线用）/ ref_leading[]（置顶锚，如拆镜末帧出图用本镜首帧），三级优先级 shot_ref>ref_slots>ref_images，按端点 capability(maxRefImages) 裁剪，applied_refs.items[].role 升级为精确槽位（character/scene/prev_last_frame/first_frame/last_frame）。D-11 起 body 可选 endpoint_id（候选端点白名单；未命中 503 ENDPOINT_NOT_ALLOWED，不扣费；命中的 candidate 单价 override 覆盖 drama.credit.frame）', responses: { '200': { description: ok } } }
  /me/drama/render/frame-jobs:
    get:  { tags: [drama], operationId: listDramaFrameJobs, parameters: [{ name: project_id, in: query, required: false, schema: { type: string } }], summary: '列出当前用户首帧后台任务（可按项目/短视频草稿过滤）。', responses: { '200': { description: ok } } }
    post: { tags: [drama], operationId: submitDramaFrameJob, summary: '提交首帧后台任务。body 同 /render/frame，额外支持 project_id/scene_id/shot_id/episode_no/name，返回可轮询任务卡。', responses: { '200': { description: ok } } }
  /me/drama/render/frame-jobs/{id}:
    parameters: [ { in: path, name: id, required: true, schema: { type: string } } ]
    get:  { tags: [drama], operationId: getDramaFrameJob, summary: '查询首帧后台任务状态与 frames 结果。', responses: { '200': { description: ok } } }
  /me/drama/render/clip:
    post: { tags: [drama], operationId: renderDramaClip, summary: '分镜视频生成（复用 MaterialVideoJob 管线 kind=drama-shot，轮询 /me/drama/episodes/jobs/{id}）。v0.72 起 body={kind?,vars{},name?,duration_sec?,ratio?,project_id?,scene_id?,shot_id?,episode_no?,frame_url?,last_frame_url?}：出片提示词模板服务端化（drama.clip_video/drama.short_clip_video）。v0.97 P2 起 frame_url=首帧 / last_frame_url=尾帧 → seedance 首+尾帧双关键帧 i2v，return_last_frame 回传真实末帧供链式承接（下游不支持则忽略）。C-1（一致性引擎）起：首/末帧生效情况回报 applied_refs（model_no_flf/model_no_image_input/local_unfetchable）；末帧成功后 CDN 镜像落 lastFrameCdnKey（真值 key，出 wire signer 派生），链式承接不过期。C-3 起可传 shot_ref（服务端派生首帧=本镜已锁首帧→同场上一镜真实末帧[文档优先+MaterialVideoJob.lastFrameCdnKey 权威回退]，末帧=本镜拆镜末帧→同场下一镜开场首帧）；显式 frame_url/last_frame_url 仍优先。D-11 起 body 可选 endpoint_id（视频候选端点白名单；未命中 503 ENDPOINT_NOT_ALLOWED，不提交/不扣费；随 variant_config 透传到 worker，命中 candidate 单价 override 覆盖 drama.credit.clip；PER_SECOND 候选按费率×时长 hold）', responses: { '200': { description: ok } } }
  /me/drama/render/tasks:
    get:  { tags: [drama], operationId: listDramaRenderTasks, parameters: [{ name: project_id, in: query, required: false, schema: { type: string } }], summary: '统一渲染后台任务视图：首帧任务 + 视频任务 + 系统负载摘要。', responses: { '200': { description: ok } } }
