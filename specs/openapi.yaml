      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/User' }

  # ── 3.2 Singers ─────────────────────────

  /singers:
    get:
      tags: [singers]
      operationId: listSingers
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/SingerStatus' }
        - name: q
          in: query
          schema: { type: string }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
      responses:
        '200':
          description: 歌手列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/SingerSummary' }
                      pagination: { $ref: '#/components/schemas/PaginationMeta' }
    post:
      tags: [singers]
      operationId: createSinger
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSingerRequest' }
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SingerDetail' }
        '402':
          description: 积分不足
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: 套餐歌手数量上限
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /singers/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [singers]
      operationId: getSinger
      responses:
        '200':
          description: 歌手详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SingerDetail' }
        '404':
          description: 歌手不存在
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    patch:
      tags: [singers]
      operationId: updateSinger
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:       { type: string }
                style:      { type: string }
                tags:       { type: array, items: { type: string } }
                status:     { $ref: '#/components/schemas/SingerStatus' }
                isPublic:   { type: boolean }
                parameters: { $ref: '#/components/schemas/PersonaParams' }
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SingerDetail' }
    delete:
      tags: [singers]
      operationId: deleteSinger
      description: 软删除（归档）
      responses:
        '200':
          description: 归档成功

  /singers/{id}/wardrobe:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [singers]
      operationId: updateSingerWardrobe
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EquippedItems' }
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/EquippedItems' }

  /singers/{id}/pose:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [singers]
      operationId: updateSingerPose
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                poseId:              { type: string, nullable: true }
                expressionId:        { type: string, nullable: true }
                expressionIntensity: { type: integer, minimum: 0, maximum: 100 }
                gestureId:           { type: string, nullable: true }
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SingerPoseConfig' }

  /singers/generate:
    post:
      tags: [singers]
      operationId: generateSinger
      description: AI生成歌手
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [parameters]
              properties:
                parameters:   { $ref: '#/components/schemas/PersonaParams' }
                prompt:       { type: string }
                referenceImageUrl: { type: string, format: uri }
      responses:
        '201':
          description: 生成成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/SingerDetail' }

