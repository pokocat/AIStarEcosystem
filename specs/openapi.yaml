                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/LedgerEntry' }
                  pagination: { $ref: '#/components/schemas/PaginationMeta' }

  /me/messages-overview:
    get:
      tags: [notifications]
      operationId: getMyMessagesOverview
      summary: '消息首页聚合（v0.5.1）：待办中心 + Bot 同事会话预览'
      responses: { '200': { description: ok } }

  /celebrity/dictionaries:
