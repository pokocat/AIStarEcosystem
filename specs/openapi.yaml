  # ── admin/error-logs（v0.30：错误日志，仅 SUPER_ADMIN） ───────────────
  /admin/audit-logs:
    get:
      tags: [admin-audit-logs]
      operationId: adminListAuditLogs
      summary: 列出账号登录注册审计日志（admin）
      description: |
        多维过滤登录注册类审计事件（/platform/auth-logs 页数据源）。
        scope=auth-all 一键过滤「登录注册全集」；或显式传 actions CSV。
        v0.57：新增 appCode 维度，按来源子应用精确过滤。
      parameters:
        - { in: query, name: userId,    schema: { type: string } }
        - { in: query, name: username,  schema: { type: string }, description: '用户名 / 手机号前缀（LIKE xxx%）' }
        - { in: query, name: action,    schema: { type: string }, description: '单动作（老调用兼容）' }
        - { in: query, name: actions,   schema: { type: string }, description: '逗号分隔的动作列表，如 admin.login,auth.sms.login' }
        - { in: query, name: scope,     schema: { type: string, enum: [auth-all] }, description: '便捷预设：auth-all = 登录注册全集' }
        - { in: query, name: ipAddress, schema: { type: string }, description: 'IP 前缀（LIKE xxx%）' }
        - { in: query, name: appCode,   schema: { type: string }, description: 'v0.57：来源子应用短码精确匹配（music/drama/celebrity/aiavatar/celebrity-mp/admin）' }
        - { in: query, name: errorCode, schema: { type: string } }
        - { in: query, name: result,    schema: { type: string, enum: [success, failure] } }
        - { in: query, name: since,     schema: { type: string, format: date-time } }
        - { in: query, name: until,     schema: { type: string, format: date-time } }
        - { in: query, name: page,      schema: { type: integer, default: 0 } }
        - { in: query, name: size,      schema: { type: integer, default: 20, maximum: 200 } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/AuditLog' }
                      pagination: { $ref: '#/components/schemas/PaginationMeta' }

  /admin/error-logs:
    get:
      tags: [admin-error-logs]
      operationId: adminListErrorLogs
      summary: 列出错误日志（仅 SUPER_ADMIN）
      parameters:
        - { in: query, name: userId,     schema: { type: string } }
        - { in: query, name: endpoint,   schema: { type: string }, description: '接口 path 子串过滤' }
        - { in: query, name: httpStatus, schema: { type: integer } }
        - { in: query, name: hostname,   schema: { type: string } }
        - { in: query, name: traceId,    schema: { type: string }, description: 'v0.30+：trace ID 精确匹配；用于看「同一请求触发了哪些错误」' }
        - { in: query, name: since,      schema: { type: string, format: date-time } }
        - { in: query, name: until,      schema: { type: string, format: date-time } }
        - { in: query, name: page,       schema: { type: integer, default: 0 } }
        - { in: query, name: size,       schema: { type: integer, default: 20, maximum: 100 } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/ErrorLog' }
        '403': { description: '当前账号非 SUPER_ADMIN' }

  /admin/error-logs/by-log-id/{logId}:
    parameters:
      - { in: path, name: logId, required: true, schema: { type: string } }
    get:
      tags: [admin-error-logs]
      operationId: adminGetErrorLogByLogId
      summary: 凭追查号查单条（用户报错时直接复述 logId 给运维）
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ErrorLog' }
        '403': { description: '当前账号非 SUPER_ADMIN' }
        '404': { description: '追查号不存在' }

