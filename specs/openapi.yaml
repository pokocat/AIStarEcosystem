  # 写动作（from-link / refresh-images）已迁至 /admin/products/**。
  /me/products/parse-link:
    post:
      tags: [products]
      operationId: parseProductLink
      summary: |
        从抖音商城链接解析商品信息（仅解析，不写库）。
        server 内部按 @Order 注入 ProductLinkHandler chain：
        DouyinQueryEmbeddedHandler（query 内嵌 goods_detail）/
        DouyinHtmlScrapeHandler（HTML 抓 og tags + window.__INITIAL_STATE__）。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductLinkParseRequest' }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ProductLinkInfo' }
        '422':
          description: 未能从该链接解析出商品信息（不支持的平台 / 页面格式变更）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # v0.31: from-link / refresh-images / 持久化卖点 已迁至 /admin/products/**。
  # 旧 path（/me/products/from-link, /me/products/{id}/refresh-images,
  # POST /products, PATCH/DELETE /products/{id},
  # /products/upsert-from-generation）已删除，仅 admin 可写。

  # ═══════════════════════════════════════════════════════════════════════
  # ▼ Admin 后台路径（v2.7+；apps/admin/src/api/*.ts 调用，对应 Admin*Controller）
  # admin 端始终带 /admin/ 前缀；服务端 AepSecurityConfig 强制 SUPER_ADMIN/OPERATOR 角色。
  # 多数 admin 端点直接复用用户端 service 层，schema 与 /celebrity/* / /products/* 一致。
  # ═══════════════════════════════════════════════════════════════════════

  # ── admin · celebrity-zone（明星专区运营视图） ──────────────

  # ── /admin/celebrity/* （v0.5：在 GET 之外补齐 CRUD）────────────────
  /admin/celebrity/stars:
    get:
      tags: [admin-celebrity]
      operationId: adminListCelebrityStars
      responses: { '200': { description: ok } }
    post:
      tags: [admin-celebrity]
      operationId: adminCreateCelebrityStar
      responses: { '201': { description: created } }
  /admin/celebrity/stars/{id}:
    # v0.62：put（adminUpdateCelebrityStar）已下线 —— 档案编辑移交明星商务工作台 PUT /star/profile
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    get:    { tags: [admin-celebrity], operationId: adminGetCelebrityStar,    responses: { '200': { description: ok } } }
    delete: { tags: [admin-celebrity], operationId: adminDeleteCelebrityStar, responses: { '204': { description: ok } } }

  /admin/celebrity/stars/{id}/photos:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post: { tags: [admin-celebrity], operationId: adminAppendCelebrityStarPhoto, responses: { '201': { description: created } } }
  /admin/celebrity/stars/{id}/photos/{photoId}:
    parameters:
      - { name: id,      in: path, required: true, schema: { type: string } }
      - { name: photoId, in: path, required: true, schema: { type: string } }
    delete: { tags: [admin-celebrity], operationId: adminRemoveCelebrityStarPhoto, responses: { '200': { description: ok } } }

  /admin/celebrity/stars/{id}/videos:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post: { tags: [admin-celebrity], operationId: adminAppendCelebrityStarVideo, responses: { '201': { description: created } } }
  /admin/celebrity/stars/{id}/videos/{videoId}:
    parameters:
      - { name: id,      in: path, required: true, schema: { type: string } }
      - { name: videoId, in: path, required: true, schema: { type: string } }
    delete: { tags: [admin-celebrity], operationId: adminRemoveCelebrityStarVideo, responses: { '200': { description: ok } } }

  /admin/celebrity/templates:
    get:  { tags: [admin-celebrity], operationId: adminListCelebrityTemplates, responses: { '200': { description: ok } } }
    post: { tags: [admin-celebrity], operationId: adminCreateCelebrityTemplate, responses: { '201': { description: created } } }
  /admin/celebrity/templates/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    put:    { tags: [admin-celebrity], operationId: adminUpdateCelebrityTemplate, responses: { '200': { description: ok } } }
    delete: { tags: [admin-celebrity], operationId: adminDeleteCelebrityTemplate, responses: { '204': { description: ok } } }
  /admin/celebrity/templates/{id}/preview:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    put: { tags: [admin-celebrity], operationId: adminSetCelebrityTemplatePreview, responses: { '200': { description: ok } } }

  # v0.21+: 运营管理「官方明星片段」（mixcut 素材的 is_official=true 子集）
  /admin/mixcut/official-clips:
    get:
      tags: [admin-mixcut]
      operationId: adminListMixcutOfficialClips
      parameters:
        - { in: query, name: category, schema: { type: string } }
        - { in: query, name: star_id,  schema: { type: string } }
      responses: { '200': { description: ok } }
    post:
      tags: [admin-mixcut]
      operationId: adminUploadMixcutOfficialClip
      responses: { '200': { description: ok } }
  /admin/mixcut/official-clips/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    put:    { tags: [admin-mixcut], operationId: adminUpdateMixcutOfficialClip, responses: { '200': { description: ok } } }
    delete: { tags: [admin-mixcut], operationId: adminDeleteMixcutOfficialClip, responses: { '200': { description: ok } } }

  # v0.55+: 运营就地编辑 / 删除「工厂模板」(factory scope，全员可见)。
  # 用户端 /mixcut/templates 的 PUT/DELETE 只作用于个人副本；本组始终落 factory scope。
  /admin/mixcut/templates/{templateId}:
    parameters: [{ name: templateId, in: path, required: true, schema: { type: string } }]
    put:    { tags: [admin-mixcut], operationId: adminUpsertMixcutFactoryTemplate, responses: { '200': { description: ok } } }
    delete: { tags: [admin-mixcut], operationId: adminDeleteMixcutFactoryTemplate, responses: { '200': { description: ok } } }

  # 明星头像 / 封面等图片上传（multipart；web-celebrity 内嵌运营 + admin 共用）。
  /admin/celebrity/uploads:
    post: { tags: [admin-celebrity], operationId: adminUploadCelebrityImage, responses: { '200': { description: ok } } }

  /admin/celebrity/showcases:       { get: { tags: [admin-celebrity], operationId: adminListCelebrityShowcases, responses: { '200': { description: ok } } } }
  /admin/celebrity/projects:        { get: { tags: [admin-celebrity], operationId: adminListCelebrityProjects,  responses: { '200': { description: ok } } } }
  /admin/celebrity/videos:          { get: { tags: [admin-celebrity], operationId: adminListCelebrityVideos,    responses: { '200': { description: ok } } } }
  /admin/celebrity/overview:        { get: { tags: [admin-celebrity], operationId: adminGetCelebrityOverview,   responses: { '200': { description: ok } } } }
  /admin/celebrity/engine-pricing:
    get: { tags: [admin-celebrity], operationId: adminGetCelebrityEnginePricing, responses: { '200': { description: ok } } }
    put: { tags: [admin-celebrity], operationId: adminReplaceCelebrityEnginePricing, responses: { '200': { description: ok } } }

  # ── v0.35：动作级权益扣减单价（celebrity.action-pricing） ───────────────────
  /admin/celebrity/action-pricing:
    get: { tags: [admin-celebrity], operationId: adminGetCelebrityActionPricing, responses: { '200': { description: ok } } }
    put: { tags: [admin-celebrity], operationId: adminReplaceCelebrityActionPricing, responses: { '200': { description: ok } } }

  # ── v0.36：销售渠道 / 售卖主体 CRUD（与 MCN 无关，仅内部可见） ──────────────
  /admin/selling-channels:
    get:  { tags: [admin-selling-channels], operationId: adminListSellingChannels,   responses: { '200': { description: ok } } }
    post: { tags: [admin-selling-channels], operationId: adminCreateSellingChannel,  responses: { '201': { description: created } } }
  /admin/selling-channels/{id}:
    get:    { tags: [admin-selling-channels], operationId: adminGetSellingChannel,    responses: { '200': { description: ok } } }
    put:    { tags: [admin-selling-channels], operationId: adminUpdateSellingChannel, responses: { '200': { description: ok } } }
    delete: { tags: [admin-selling-channels], operationId: adminDeleteSellingChannel, responses: { '204': { description: deleted (soft) } } }

  # ── v0.37：平台运营登录（AepUser + operatorRole 体系，独立通道） ─────────────
  /admin/auth/login:
    post:
      tags: [admin-auth]
      operationId: adminLogin
      summary: admin_users 管理员账号密码登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, description: 用户名或邮箱 }
                password: { type: string }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          token: { type: string }
                          user: { $ref: '#/components/schemas/AdminAuthUser' }
        '400': { description: 用户名或密码为空 }
        '401': { description: 用户名或密码错误 }
        '403': { description: 账号已停用 }
  /admin/auth/me:
    get:
      tags: [admin-auth]
      operationId: adminGetMe
      summary: 当前后台登录身份
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AdminAuthUser' }
        '401': { description: unauthorized }
  /admin/auth/operator-login:
    post:
      tags: [admin-auth]
      operationId: adminOperatorLogin
      summary: AepUser.operatorRole 平台运营账号密码登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, description: AepUser.username }
                password: { type: string }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          token: { type: string }
                          user: { $ref: '#/components/schemas/AdminAuthUser' }
        '400': { description: 用户名或密码为空 }
        '401': { description: 用户名或密码错误 }
        '403': { description: 无 operatorRole / 未设置密码 / 账号已停用 }
  /admin/auth/change-password:
    post:
      tags: [admin-auth]
      operationId: adminChangeOwnPassword
      summary: 当前后台登录账号修改自己的密码，兼容 admin 和 operator 两种账号来源
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string }
                newPassword: { type: string, minLength: 6 }
      responses:
        '200': { description: ok }
        '400': { description: 当前密码或新密码为空 / 新密码太短 / 新旧密码相同 }
        '401': { description: unauthorized }
        '403': { description: 当前密码错误 }

  # ── v0.37：超级管理员给 AepUser 设置密码（让 operator 能登 admin） ─────────
  /admin/aep-users/{id}/set-password:
    post: { tags: [admin-aep-users], operationId: adminSetAepUserPassword, responses: { '200': { description: ok }, '403': { description: 'requires SUPER_ADMIN' } } }

  # ── 授权关系 CRUD + 状态机（v0.5 §D3 新增） ──────────────────────────
  /admin/celebrity/star-authorizations:
    get:
      tags: [admin-celebrity]
      operationId: adminListCelebrityStarAuthorizations
      parameters:
        - { name: userId, in: query, schema: { type: string } }
        - { name: starId, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [unauthorized, pending, authorized, expired] } }
      responses: { '200': { description: ok } }
    post:
      tags: [admin-celebrity]
      operationId: adminCreateCelebrityStarAuthorization
      responses: { '201': { description: created } }
  /admin/celebrity/star-authorizations/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    get:    { tags: [admin-celebrity], operationId: adminGetCelebrityStarAuthorization,    responses: { '200': { description: ok } } }
    put:    { tags: [admin-celebrity], operationId: adminUpdateCelebrityStarAuthorization, responses: { '200': { description: ok } } }
    delete: { tags: [admin-celebrity], operationId: adminDeleteCelebrityStarAuthorization, responses: { '204': { description: ok } } }
  /admin/celebrity/star-authorizations/{id}/transition:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post: { tags: [admin-celebrity], operationId: adminTransitionCelebrityStarAuthorization, responses: { '200': { description: ok } } }

  # ── 充值套餐 CRUD（v0.5 §D4 新增） ────────────────────────────────────
  # ── 支付配置（v0.94 多渠道：渠道启用 + 机密运行时可配，FINANCE_ADMIN/SUPER_ADMIN，机密脱敏出 wire） ──
  /admin/payment/channels:
    get: { tags: [admin-finance], operationId: adminListPaymentChannels, summary: '全部可配支付渠道（脱敏）', responses: { '200': { description: ok } } }
  /admin/payment/channels/{code}:
    parameters: [{ name: code, in: path, required: true, schema: { type: string, description: 'alipay / wechat' } }]
    put:  { tags: [admin-finance], operationId: adminUpdatePaymentChannel, summary: '改启用/沙箱/默认支付方式/机密（空=保留，__CLEAR__=清空）', responses: { '200': { description: ok } } }
  /admin/payment/channels/{code}/test:
    parameters: [{ name: code, in: path, required: true, schema: { type: string } }]
    post: { tags: [admin-finance], operationId: adminTestPaymentChannel, summary: '轻量自检：机密是否齐全 + 网关是否就绪', responses: { '200': { description: ok } } }

  /admin/finance/recharge-packages:
    get:  { tags: [admin-finance], operationId: adminListRechargePackages, responses: { '200': { description: ok } } }
    post: { tags: [admin-finance], operationId: adminCreateRechargePackage, responses: { '201': { description: created } } }
  /admin/finance/recharge-packages/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    get:    { tags: [admin-finance], operationId: adminGetRechargePackage,    responses: { '200': { description: ok } } }
    put:    { tags: [admin-finance], operationId: adminUpdateRechargePackage, responses: { '200': { description: ok } } }
    delete: { tags: [admin-finance], operationId: adminDeleteRechargePackage, responses: { '200': { description: ok, content: { application/json: { schema: { type: object } } } } } }

  # ── 充值订单核销（v0.56 新增：用户下单 → 运营线下收款后核准入账 / 驳回） ──────
  /admin/finance/recharge-orders:
    get:
      tags: [admin-finance]
      operationId: adminListRechargeOrders
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, paid, rejected, cancelled, refunded, all] } }
      responses: { '200': { description: ok } }
  /admin/finance/recharge-orders/{orderId}/approve:
    parameters: [{ name: orderId, in: path, required: true, schema: { type: string } }]
    post: { tags: [admin-finance], operationId: adminApproveRechargeOrder, responses: { '200': { description: ok } } }
  /admin/finance/recharge-orders/{orderId}/reject:
    parameters: [{ name: orderId, in: path, required: true, schema: { type: string } }]
    post: { tags: [admin-finance], operationId: adminRejectRechargeOrder, responses: { '200': { description: ok } } }
  /admin/finance/recharge-orders/{orderId}/sync:
    parameters: [{ name: orderId, in: path, required: true, schema: { type: string } }]
    post: { tags: [admin-finance], operationId: adminSyncRechargeOrder, summary: '查单同步：在线 PENDING 订单查网关→已支付自动入账/超时关单（v2 §6；在线单不可手工核准）', responses: { '200': { description: ok } } }
  /admin/finance/recharge-orders/{orderId}/refund:
    parameters: [{ name: orderId, in: path, required: true, schema: { type: string } }]
    post:
      tags: [admin-finance]
      operationId: adminRefundRechargeOrder
      summary: 现金退款 + 未消费积分回收（v2 §15.5 / D17，限 FINANCE_ADMIN / SUPER_ADMIN；仅 PAID 订单，clamp 到未消费充值额）
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses:
        '200': { description: "订单转 REFUNDED + 写资金面 REFUND_CASH 回收分录" }
        '409': { description: "已消费完毕无可回收 / 订单非 PAID" }
  /admin/finance/reconciliation:
    get:
      tags: [admin-finance]
      operationId: adminReconciliationReport
      summary: 对账重算（v2 §11，限 FINANCE_ADMIN / SUPER_ADMIN）—— 现金勾稽（排除影子）+ 积分负债单列 + drift 告警
      responses: { '200': { description: "ReconciliationReport（grossRecharge/netCashCredits/drift/balanced/creditLiability …）" } }

  # ── v2 §9 积分面 lane：调差 / 赠送（只发 giftBalance，不碰资金面）。CreditOpsService ──
  /admin/finance/adjustments/compensate:
    post:
      tags: [admin-finance]
      operationId: adminCompensate
      summary: 客诉补偿（v2 §9 积分面）—— 给用户补发赠送积分，挂工单号；不碰资金面
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, amount, incidentRef, reason]
              properties:
                userId: { type: string }
                amount: { type: integer, format: int64 }
                incidentRef: { type: string }
                reason: { type: string }
      responses: { '200': { description: "新增账本分录（GIFT）" } }
  /admin/finance/adjustments/grant:
    post:
      tags: [admin-finance]
      operationId: adminGrantGift
      summary: 激励赠送（v2 §9 积分面）—— 给用户发赠送积分，可挂活动号；不碰资金面
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId, amount, reason]
              properties:
                userId: { type: string }
                amount: { type: integer, format: int64 }
                campaignId: { type: string }
                reason: { type: string }
      responses: { '200': { description: "新增账本分录（GIFT）；超阈值时进审批，pending=true" } }
  /admin/finance/adjustments/requests:
    get:
      tags: [admin-finance]
      operationId: adminListAdjustmentRequests
      summary: 大额调差 / 赠送审批队列（v2 §9.2 maker-checker）
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending_approval, approved, rejected, all] } }
      responses: { '200': { description: "ok（CreditAdjustmentRequest[]）" } }
  /admin/finance/adjustments/requests/{id}/approve:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post:
      tags: [admin-finance]
      operationId: adminApproveAdjustmentRequest
      summary: 批准大额审批单（限 FINANCE_ADMIN / SUPER_ADMIN；服务端校验 maker≠checker）
      responses: { '200': { description: "已批准并入账（GIFT）" } }
  /admin/finance/adjustments/requests/{id}/reject:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    post:
      tags: [admin-finance]
      operationId: adminRejectAdjustmentRequest
      summary: 驳回大额审批单（限 FINANCE_ADMIN / SUPER_ADMIN）
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string }
      responses: { '200': { description: "已驳回" } }

  # ── 结算中心只读视图（v0.58 backfill：钱包 / 流水 / 业务交易，DTO 附带账号登录名 / 昵称 + 秒级时间） ──
  /admin/wallets:
    get:
      tags: [admin-finance]
      operationId: adminListWallets
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 0 } }
        - { name: size, in: query, schema: { type: integer, default: 20 } }
      responses: { '200': { description: 'ok（PageEnvelope<Wallet>）' } }
  /admin/wallets/{userId}:
    parameters: [{ name: userId, in: path, required: true, schema: { type: string } }]
    get: { tags: [admin-finance], operationId: adminGetWalletByUser, responses: { '200': { description: ok } } }
  /admin/ledger-entries:
    get:
      tags: [admin-finance]
      operationId: adminListLedgerEntries
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 0 } }
        - { name: size, in: query, schema: { type: integer, default: 20 } }
        - { name: walletId, in: query, schema: { type: string } }
        - { name: userId, in: query, schema: { type: string } }
      responses: { '200': { description: 'ok（PageEnvelope<LedgerEntry>）' } }
  /admin/finance/transactions:
    get:
      tags: [admin-finance]
      operationId: adminListFinanceTransactions
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 0 } }
        - { name: size, in: query, schema: { type: integer, default: 20 } }
        - { name: userId, in: query, schema: { type: string } }
      responses: { '200': { description: 'ok（LedgerEntry 派生业务交易；FREEZE 且 hold 仍 ACTIVE → processing）' } }
  /admin/finance/revenue/monthly:
    get: { tags: [admin-finance], operationId: adminMonthlyRevenue, responses: { '200': { description: ok } } }
  /admin/finance/revenue/sources:
    get: { tags: [admin-finance], operationId: adminRevenueSources, responses: { '200': { description: ok } } }

  # ── 运营收件箱（v0.58 真实化：只列 userId=__admin__ 行；业务事件由 NotificationPublisher 写入） ──
  /admin/notifications:
    get:
      tags: [admin-notifications]
      operationId: adminListNotifications
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 0 } }
        - { name: size, in: query, schema: { type: integer, default: 20 } }
      responses: { '200': { description: 'ok（PageEnvelope<Notification>，含 audience 关联账号）' } }
  /admin/notifications/{id}/read:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
