        # ── v0.4：详情页扩展字段（admin 后台维护，小程序消费） ──
        bio:               { type: string, nullable: true }
        location:          { type: string, nullable: true }
        fans:              { type: integer, format: int64, nullable: true }
        cooperationCount:  { type: integer, nullable: true }
        avgGmv:            { type: integer, format: int64, nullable: true }
        photos:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/CelebrityStarPhoto' }
        videos:
          type: array
          nullable: true
          items: { $ref: '#/components/schemas/CelebrityStarVideo' }

    CelebrityStarPhoto:
      type: object
      required: [id, url]
      properties:
        id:       { type: string }
        url:      { type: string }
        caption:  { type: string, nullable: true }

    CelebrityStarVideo:
      type: object
      required: [id, title, durationSec]
      properties:
        id:           { type: string }
        title:        { type: string }
        durationSec:  { type: integer }
        coverUrl:     { type: string, nullable: true }
        playUrl:      { type: string, nullable: true }
        tag:          { type: string, nullable: true }

    TemplateStyle:
      type: string
      enum: [种草安利, 硬核测评, 轻松开箱, 直播切片, 剧情植入]

    CelebrityTemplate:
      type: object
      required: [id, name, style, description, recommendedEngine, recommendedPrice,
                 isHot, plays, conversionRate, isFactory, ownerScope]
      properties:
        id:                 { type: string }
        name:               { type: string }
        style:              { $ref: '#/components/schemas/TemplateStyle' }
        description:        { type: string }
        recommendedEngine:  { $ref: '#/components/schemas/CelebrityEngine' }
        recommendedPrice:   { type: string }
        isHot:              { type: boolean }
        plays:              { type: string }
        conversionRate:     { type: string }
        fitHint:            { type: string, nullable: true }
        previews:
          type: array
          items:
            type: object
            properties:
              thumb:    { type: string }
              videoUrl: { type: string, nullable: true }
        # ── v0.4：模板效果预览（admin 上传整段预览视频） ──
        previewCover:     { type: string, nullable: true }
        previewVideoUrl:  { type: string, nullable: true }
        durationSec:      { type: integer, enum: [15, 30, 60], nullable: true }
        # ── v0.34：工厂 vs 用户私有模板归属 ──
        isFactory:        { type: boolean, description: 'true = 工厂模板（所有用户可见），false = 用户私有' }
        ownerScope:       { type: string, description: '"factory" 或 ownerUserId；过滤可见性' }
        ownerUserId:      { type: string, nullable: true }

    CelebrityProjectStatus:
      type: string
      enum: [进行中, 筹备中, 已完成]

    ChannelStatus:
      type: object
      required: [id, name, connected, publishedCount]
      properties:
        id:              { type: string }
        name:            { type: string, enum: [抖音, 快手, 小红书, 视频号, B站] }
        connected:       { type: boolean }
        publishedCount:  { type: integer }

    CelebrityProject:
      type: object
      required: [id, name, starId, starName, starAvatar, status, videoCount,
                 totalPlays, totalInteractions, conversions, gmv, createdAt,
                 pricingTier, channels, quota]
      properties:
        id:                { type: string }
        name:              { type: string }
        starId:            { type: string }
        starName:          { type: string }
        starAvatar:        { type: string }
        status:            { $ref: '#/components/schemas/CelebrityProjectStatus' }
        videoCount:        { type: integer }
        totalPlays:        { type: string }
        totalInteractions: { type: string }
        conversions:       { type: integer }
        gmv:               { type: string }
        createdAt:         { type: string, format: date }
        pricingTier:       { $ref: '#/components/schemas/CelebrityPricingTierName' }
        channels:
          type: array
          items: { $ref: '#/components/schemas/ChannelStatus' }
        quota:
          type: object
          required: [used, total]
          properties:
            used:  { type: integer }
            total: { type: integer }

    ProjectVideoStatus:
      type: string
      enum: [已发布, 待审核, 生成中, 已驳回]

    CelebrityProjectVideo:
      type: object
      required: [id, projectId, projectName, starId, starName, productName,
                 status, durationSec, engine, thumb, videoUrl, createdAt]
      properties:
        id:           { type: string }
        projectId:    { type: string }
        projectName:  { type: string }
        starId:       { type: string }
        starName:     { type: string }
        productName:  { type: string }
        status:       { $ref: '#/components/schemas/ProjectVideoStatus' }
        plays:        { type: string, nullable: true }
        durationSec:  { type: integer, enum: [15, 30, 60] }
        engine:       { $ref: '#/components/schemas/CelebrityEngine' }
        thumb:        { type: string }
        videoUrl:     { type: string }
        createdAt:    { type: string, format: date }

    CelebrityProductInput:
      type: object
      required: [name, sellingPoints]
      properties:
        name:          { type: string }
        link:          { type: string, nullable: true }
        images:
          type: array
          items: { type: string }
        sellingPoints: { type: string }

    CelebrityShowcase:
      type: object
      required: [id, caption, engine, plays]
      properties:
        id:       { type: string }
        caption:  { type: string }
        engine:   { $ref: '#/components/schemas/CelebrityEngine' }
        plays:    { type: string }
        approval: { type: string, nullable: true }
        thumb:    { type: string, nullable: true }
        videoUrl: { type: string, nullable: true }

    CelebrityGenerationRequest:
      type: object
      required: [starId, mode, product, engine, duration, projectId]
      properties:
        starId:     { type: string }
        mode:       { type: string, enum: [template, blindbox] }
        templateId: { type: string, nullable: true }
        product:    { $ref: '#/components/schemas/CelebrityProductInput' }
        engine:     { $ref: '#/components/schemas/CelebrityEngine' }
        duration:   { type: integer, enum: [15, 30, 60] }
        creativeTendency: { type: string, nullable: true }
        projectId:  { type: string }
        channels:
          type: array
          items: { type: string }
        # ── v0.4：模型选择 + 动态扣分（小程序生成器使用） ──
        engineName: { $ref: '#/components/schemas/CelebrityEngine', nullable: true }
        durationSec: { type: integer, enum: [15, 30, 60], nullable: true }
        creditCost:  { type: integer, nullable: true, description: '前端按 engine.creditPrice × 时长系数计算后透传' }
        language:    { type: string, nullable: true }
        keypoints:
          type: array
          nullable: true
          items: { type: string }

    CelebrityZoneOverview:
      type: object
      description: 数据中心大盘（celebrity-zone ?tab=data）。
      required: [hero, starLeaderboard, weeklyTrend, channelMix]
      properties:
        hero:
          type: object
          required: [totalPlays, totalConversions, activeStars]
          properties:
            totalPlays:       { type: string }
            totalConversions: { type: string }
            activeStars:      { type: integer }
        starLeaderboard:
          type: array
          items:
            type: object
            required: [starId, name, avatar, plays, gmv, videoCount]
            properties:
              starId:     { type: string }
              name:       { type: string }
              avatar:     { type: string }
              plays:      { type: string }
              gmv:        { type: string }
              videoCount: { type: integer }
        weeklyTrend:
          type: array
          items:
            type: object
            required: [date, plays, conversions]
            properties:
              date:        { type: string, format: date }
              plays:       { type: integer }
              conversions: { type: integer }
        channelMix:
          type: array
          items:
            type: object
            required: [channel, share]
            properties:
              channel: { type: string }
              share:   { type: number, description: '0~1' }

    # ── 商品库（v2.7；src/types/product.ts）

    ProductCategory:
      type: string
      enum: [美妆, 食品饮料, 数码 3C, 服饰, 日用百货, 母婴, 运动, 其他]

    ProductSource:
      type: string
      enum: [manual, auto-from-generation]

    Product:
      type: object
      required: [id, name, category, images, sellingPoints, usageCount,
                 source, createdAt, updatedAt]
      properties:
        id:             { type: string }
        name:           { type: string }
        category:       { $ref: '#/components/schemas/ProductCategory' }
        link:           { type: string, nullable: true }
        images:
          type: array
          items: { type: string }
        sellingPoints:  { type: string }
        usageCount:     { type: integer }
        source:         { $ref: '#/components/schemas/ProductSource' }
        # v0.26+: 售价（分）+ 佣金率（0-100 整数百分比）
        priceCents:     { type: integer, nullable: true }
        commissionRate: { type: integer, nullable: true, minimum: 0, maximum: 100 }
        createdAt:      { type: string, format: date }
        updatedAt:      { type: string, format: date }

    ProductInput:
      type: object
      required: [name, category]
      properties:
        name:          { type: string }
        category:      { $ref: '#/components/schemas/ProductCategory' }
        link:          { type: string, nullable: true }
        images:
          type: array
          items: { type: string }
        sellingPoints: { type: string, nullable: true }
        source:        { $ref: '#/components/schemas/ProductSource' }
        # v0.26+: 售价 + 佣金率
        priceCents:     { type: integer, nullable: true }
        commissionRate: { type: integer, nullable: true, minimum: 0, maximum: 100 }

    # v0.26+ 商品链接解析（抖音商城）—— server 端策略链返回
    ProductLinkInfo:
      type: object
      required: [imageUrls, source]
      properties:
        title:                 { type: string, nullable: true }
        imageUrls:
          type: array
          items: { type: string }
        minPriceCents:         { type: integer, nullable: true }
        maxPriceCents:         { type: integer, nullable: true }
        sales:                 { type: integer, nullable: true }
        inferredSellingPoints: { type: string, nullable: true }
        source:                { type: string, description: "命中的 handler 名（douyin-query-embedded / douyin-html-scrape）" }

    ProductLinkParseRequest:
      type: object
      required: [url]
      properties:
        url:  { type: string, description: "抖音商城分享长链 或 PC 选品库短链" }

    # ── 异步任务壳（生成 / 分发 / 抽取等的统一返回）

    AsyncJobStarted:
      type: object
      required: [jobId, status]
      properties:
        jobId:             { type: string }
        status:            { type: string, enum: [queued, running, succeeded, failed, cancelled] }
        pollUrl:           { type: string, nullable: true }
        pollIntervalMs:    { type: integer, nullable: true }
        estimatedSeconds:  { type: integer, nullable: true }

    # ── 2.22 Social Distribution (sau 集成) ────
    # 短视频分发：用户绑定平台账号 (扫码) → 创建发布任务 → server 通过 sau-service
    # (Python+Playwright) 自动上传。storage_state (cookie) 在 server DB 加密存储，
    # 永不出口到前端 DTO。

    SocialPlatform:
      type: string
      enum: [douyin, kuaishou, xiaohongshu, shipinhao, bilibili, tiktok, youtube, baijiahao]
      description: |
        v1 仅启用前 4 个 (抖音 / 快手 / 小红书 / 视频号)；
        bilibili / tiktok / youtube / baijiahao 在 enum 占位但 service 抛 NOT_IMPLEMENTED。

    SocialAccountStatus:
      type: string
      enum: [active, expired, banned, pending]
      description: pending=绑定中尚未完成扫码；active=cookie 有效；expired=cookie 失效需重绑；banned=平台封禁

    SocialAccount:
      type: object
      required: [id, userId, platform, accountName, status, boundAt]
      properties:
        id:               { type: string }
        userId:           { type: string }
        platform:         { $ref: '#/components/schemas/SocialPlatform' }
        accountName:      { type: string, description: 用户自取的别名 }
        status:           { $ref: '#/components/schemas/SocialAccountStatus' }
        displayName:      { type: string, nullable: true }
        platformAccountId: { type: string, nullable: true, description: 平台侧账号号 / handle，例如抖音号 }
        avatarUrl:        { type: string, nullable: true }
        boundAt:          { type: string, format: date-time }
        lastVerifiedAt:   { type: string, format: date-time, nullable: true }
      description: |
        响应 DTO **不含 storage_state**；cookie 仅在 server DB 加密存储。

    SocialAccountBindInput:
      type: object
      required: [platform, accountName]
      properties:
        platform:    { $ref: '#/components/schemas/SocialPlatform' }
        accountName: { type: string }

    SocialAccountBindInit:
      type: object
      required: [sessionTicket, expiresAt]
      properties:
        sessionTicket:    { type: string, description: 用于 /bind-poll 的 ticket }
        qrImageDataUrl:   { type: string, nullable: true, description: "data:image/png;base64,..." }
        qrUrl:            { type: string, nullable: true, description: 部分平台是 deeplink 而非图片 }
        alreadyLoggedIn:  { type: boolean, description: sau-service 发现已有登录态，无需展示 QR }
        expiresAt:        { type: string, format: date-time }

    SocialAccountBindPollResult:
      type: object
      required: [status]
      properties:
        status:  { type: string, enum: [pending, awaiting_user, success, expired, failed] }
        account: { $ref: '#/components/schemas/SocialAccount' }
        interactionRequired:
          allOf:
            - $ref: '#/components/schemas/InteractionRequired'
          nullable: true
          description: status=awaiting_user 时存在；账号绑定阶段的短信验证码等交互上下文
        errorCode:    { type: string, nullable: true }
        message:      { type: string, nullable: true }
        diagnosticId: { type: string, nullable: true }

    PublishJobStatus:
      type: string
      description: |
        发布任务状态机。主线 QUEUED → UPLOADING → TRANSCODING → PUBLISHING → LIVE。
        AWAITING_USER 是「暂停」状态：平台弹出人机交互（短信验证码等）时进入；
        用户提交响应后回到 UPLOADING / PUBLISHING；用户超时（默认 5 分钟未输入）则
        转 FAILED with errorCode=AWAIT_USER_TIMEOUT。
      enum: [queued, uploading, transcoding, publishing, live, awaiting_user, failed, cancelled]

    InteractionRequired:
      type: object
      required: [kind, prompt, createdAt]
      description: |
        平台弹出的需要用户输入才能继续的人机交互上下文。仅当 PublishJob.status=awaiting_user
        时存在；mirror packages/types/src/publish-job.ts InteractionRequired。
      properties:
        kind:
          type: string
          enum: [sms]
          description: 交互类型；MVP 仅 sms（短信验证码），后续可加 captcha / slider
        prompt:
          type: string
          description: 给用户看的提示文案（中文）
        phoneMasked:
          type: string
          nullable: true
          description: 已脱敏的手机号，例如 "138****5678"
        canResendAt:
          type: string
          format: date-time
          nullable: true
          description: 下次允许重发短信的时间戳；未到点前 UI 应灰掉「重新发送」按钮
        createdAt:
          type: string
          format: date-time
          description: 进入 awaiting_user 的时间；前端用来算等待时长 + 5 分钟超时倒计时

    PublishJob:
      type: object
      required: [id, projectId, platformId, platformName, status, progress, createdAt, updatedAt]
      properties:
        id:                { type: string }
        userId:            { type: string, nullable: true, description: sau 流程必填；drama legacy mock 可空 }
        projectId:         { type: string }
        socialAccountId:   { type: string, nullable: true }
        platformId:        { type: string }
        platformName:      { type: string }
        status:            { $ref: '#/components/schemas/PublishJobStatus' }
        progress:          { type: integer, minimum: 0, maximum: 100 }
        videoUrl:          { type: string, nullable: true, description: sau-service 拉取的源视频 URL }
        title:             { type: string, nullable: true }
        description:       { type: string, nullable: true }
        tags:              { type: array, items: { type: string }, nullable: true }
        coverUrl:          { type: string, nullable: true }
        externalTaskId:    { type: string, nullable: true, description: sau-service 远端任务 id (idempotent callback key) }
        externalUrl:       { type: string, nullable: true, description: 平台发布后的可访问 URL }
        errorCode:         { type: string, nullable: true }
        errorMessage:      { type: string, nullable: true }
        creditsSpent:      { type: integer, nullable: true, description: 任务扣的积分；失败不退 }
        interactionRequired:
          allOf:
            - $ref: '#/components/schemas/InteractionRequired'
          nullable: true
          description: status=awaiting_user 时存在；其他状态为 null
        createdAt:         { type: string, format: date-time }
        updatedAt:         { type: string, format: date-time }
        scheduledAt:       { type: string, format: date-time, nullable: true }

    CreatePublishJobInput:
      type: object
      required: [videoUrl, title, description, tags, targets]
      properties:
        projectId:
          type: string
          nullable: true
          description: |
            可选。缺省 / 空串 / 字面 "manual" 时服务端自动生成 "manual-batch-<userId>-<yyyyMMddHHmmss>"。
            混剪批量发布显式传 "mixcut-batch-<source>-<ts>"。两套前缀让任务追踪能区分 source 标签。
        videoUrl:     { type: string, description: sau-service 拉取的源视频 URL (公网可访问) }
        title:        { type: string }
        description:  { type: string }
        tags:         { type: array, items: { type: string } }
        coverUrl:     { type: string, nullable: true }
        targets:
          type: array
          minItems: 1
          items:
            type: object
            required: [platform, socialAccountId]
            properties:
              platform:         { $ref: '#/components/schemas/SocialPlatform' }
              socialAccountId:  { type: string }
              scheduledAt:      { type: string, format: date-time, nullable: true }

    PublishJobCallback:
      type: object
      required: [externalTaskId, status]
      properties:
        externalTaskId:  { type: string }
        status:          { $ref: '#/components/schemas/PublishJobStatus' }
        progress:        { type: integer, minimum: 0, maximum: 100, nullable: true }
        externalUrl:     { type: string, nullable: true }
        errorCode:       { type: string, nullable: true }
        errorMessage:    { type: string, nullable: true }
        interactionRequired:
          allOf:
            - $ref: '#/components/schemas/InteractionRequired'
          nullable: true
          description: |
            进入 awaiting_user 时由 sau-service 推；离开 awaiting_user 时显式置 null。
            其它 status 必须留空。
      description: |
        sau-service → server 的进度推送 payload (POST /internal/sau/job-callback)。
        以 externalTaskId 幂等；状态推进遵循 PublishJobStatus 状态机
        （AWAITING_USER 双向：可从 UPLOADING/TRANSCODING/PUBLISHING 进入，回到 UPLOADING/PUBLISHING/LIVE）。

    PublishJobEvent:
      type: object
      required: [id, jobId, kind, at]
      description: 发布任务不可变事件流（admin 审计视图）；mirror packages/types PublishJobEvent。
      properties:
        id:          { type: string }
        jobId:       { type: string }
        kind:        { type: string, description: "transition / progress / callback / error / system" }
        fromStatus:  { $ref: '#/components/schemas/PublishJobStatus', nullable: true }
        toStatus:    { $ref: '#/components/schemas/PublishJobStatus', nullable: true }
        progress:    { type: integer, minimum: 0, maximum: 100, nullable: true }
        note:        { type: string, nullable: true }
        at:          { type: string, format: date-time }

    # ── v0.20: 调度策略 sealed union（mixcut publish + v0.22 任务追踪 reschedule 共享） ──
    # 注意 wire key 是 snake_case（@JsonProperty 显式映射），与一般 camelCase 字段约定的例外。
    # 后端真值见 apps/server/.../dto/MixcutPublishBatchRequest.java#ScheduleSpec
    ScheduleSpec:
      oneOf:
        - $ref: '#/components/schemas/ScheduleSpecImmediate'
        - $ref: '#/components/schemas/ScheduleSpecSingle'
        - $ref: '#/components/schemas/ScheduleSpecDailyRecurring'
      discriminator:
        propertyName: strategy
        mapping:
          immediate: '#/components/schemas/ScheduleSpecImmediate'
          single: '#/components/schemas/ScheduleSpecSingle'
          daily_recurring: '#/components/schemas/ScheduleSpecDailyRecurring'

    ScheduleSpecImmediate:
      type: object
      required: [strategy]
      properties:
        strategy: { type: string, enum: [immediate] }

    ScheduleSpecSingle:
      type: object
      required: [strategy, at]
      properties:
        strategy: { type: string, enum: [single] }
        at:       { type: string, format: date-time, description: ISO 8601 UTC 时刻 }

    ScheduleSpecDailyRecurring:
      type: object
      required: [strategy, start_date, time_slots, timezone]
      properties:
        strategy:        { type: string, enum: [daily_recurring] }
        start_date:      { type: string, description: '"YYYY-MM-DD" 在 timezone 下的日历日' }
        time_slots:
          type: array
          minItems: 1
          items: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$' }
          description: '["09:00","12:00","18:00"]，HH:MM 24h；后端会排序去重'
        timezone:        { type: string, description: 'IANA, 例 "Asia/Shanghai"' }
        max_days:        { type: integer, nullable: true, description: 'null = 直到 outputs 用完；非 null 时要 N <= max_days * time_slots.length' }
        jitter_minutes:  { type: integer, nullable: true, minimum: 0, maximum: 30, description: '[0, 30]；null/0 = 无抖动' }

    # ── v0.22: 任务追踪 ──
    PublishBatchSource:
      type: string
      enum: [mixcut, manual, other]
      description: 据 projectId 前缀派生的来源标签（mixcut-batch- / manual-batch- / 其他）

    PublishBatchSummary:
      type: object
      required: [projectId, source, displayTitle, totalJobs, statusCounts, progressPct, firstCreatedAt, lastCreatedAt, platforms, hasInflight]
      description: |
        某 projectId 下所有 PublishJob 的聚合卡片。mirror packages/types PublishBatchSummary。
        服务端按 GROUP BY project_id 拉，Java 层 fold 后返回；不在 DB 落实体表。
      properties:
        projectId:    { type: string }
        source:       { $ref: '#/components/schemas/PublishBatchSource' }
        displayTitle: { type: string, description: "<title> ×N；title 取批次内首条 non-blank" }
        totalJobs:    { type: integer, minimum: 0 }
        statusCounts:
          type: object
          additionalProperties: { type: integer, minimum: 0 }
          description: 8 个 wire key（queued/uploading/transcoding/publishing/awaiting_user/live/failed/cancelled）→ count；0 也保留
        progressPct:        { type: integer, minimum: 0, maximum: 100, description: (live + failed + cancelled) / total * 100，floor }
        firstCreatedAt:     { type: string, format: date-time }
        lastCreatedAt:      { type: string, format: date-time }
        firstScheduledAt:   { type: string, format: date-time, nullable: true }
        lastScheduledAt:    { type: string, format: date-time, nullable: true }
        platforms:
          type: array
          items: { type: string }
          description: distinct platform wire 名（按首次出现顺序）
        hasInflight: { type: boolean, description: queued/uploading/transcoding/publishing/awaiting_user 任一非零 }

    RescheduleBatchInput:
      type: object
      required: [schedule]
      properties:
        schedule: { $ref: '#/components/schemas/ScheduleSpec' }
      description: |
        POST /me/publish-jobs/batches/{projectId}/reschedule 请求体。
        仅对 status=queued 的子集生效；其他状态原样保留。

    ErrorLog:
      type: object
      description: |
        v0.30：错误日志记录。所有被 GlobalExceptionHandler 兜底的异常（业务 + 系统）入库。
        仅 SUPER_ADMIN 可访问 /admin/error-logs；OPERATOR 调用返回 403。
      required: [id, logId, occurredAt]
      properties:
        id:            { type: string, description: 'UUID 内部主键' }
        logId:         { type: string, description: '短追查号（12 字符），用户报错时复述' }
        traceId:       { type: string, nullable: true, description: 'v0.30+：请求级 trace ID（X-Trace-Id），跨进程串联日志用（server / sau-service / @Async worker 共享）' }
        occurredAt:    { type: string, format: date-time }
        hostname:      { type: string, nullable: true, description: '发生异常的机器（容器/Pod hostname）' }
        userId:        { type: string, nullable: true }
        username:      { type: string, nullable: true }
        httpMethod:    { type: string, nullable: true }
        endpoint:      { type: string, nullable: true, description: '请求 path（不含 host/query）' }
        httpStatus:    { type: integer, nullable: true }
        errorType:     { type: string, nullable: true, description: '异常类简名' }
        errorCode:     { type: string, nullable: true, description: '业务码（BusinessException 才有）' }
        message:       { type: string, nullable: true }
        stacktrace:    { type: string, nullable: true, description: '已截到 8KB 内的完整堆栈' }
        requestParams: { type: string, nullable: true, description: '脱敏后的请求参数 JSON 文本' }
        userAgent:     { type: string, nullable: true }
        clientIp:      { type: string, nullable: true }

    AuditLog:
      type: object
      description: |
        v0.47：业务行为审计（登录 / 注册 / 激活 / 改密等正常路径的成功 + 失败都落库）。
        与 ErrorLog 区别：ErrorLog 是被 GlobalExceptionHandler 兜底的异常；AuditLog 是业务侧主动 record 的合规审计。
        v0.57：新增 appCode（来源子应用），由客户端 X-App-Code 头携带，AuditService.recordAuth 统一落库。
        仅 admin 可访问 /admin/audit-logs。
      required: [id, action, result, createdAt]
      properties:
        id:           { type: string, description: 'UUID 内部主键' }
        userId:       { type: string, nullable: true, description: '登录用户 id（失败登录时可能为 null）' }
        username:     { type: string, nullable: true, description: '登录输入的辨识串（admin username / 手机号），失败时也落，便于排查暴力枚举' }
        tenantId:     { type: string, nullable: true }
        action:       { type: string, description: '动作命名，见 server AuditService.Actions（admin.login / auth.sms.login / auth.password.login / …）' }
        resourceType: { type: string, nullable: true, description: "登录注册类恒为 'auth'" }
        resourceId:   { type: string, nullable: true }
        errorCode:    { type: string, nullable: true, description: '失败时的业务码（如 ADMIN_CREDENTIALS_INVALID）；成功时 null' }
        ipAddress:    { type: string, nullable: true, description: '客户端 IP（含 X-Forwarded-For / X-Real-IP 兼容）' }
        userAgent:    { type: string, nullable: true }
        appCode:
          type: string
          nullable: true
          description: |
            v0.57：来源子应用短码，由客户端 X-App-Code 头携带。取值 music / drama / celebrity / aiavatar / star
            （web 子应用）+ celebrity-mp（微信小程序）+ admin（后台）。老数据 / 未带头时为 null。
        result:       { type: string, enum: [success, failure], description: 'wire 上小写' }
        detail:       { type: string, nullable: true, description: '人类可读详情（含上下文）' }
        createdAt:    { type: string, format: date-time }


    # ── 明星商务工作台（web-star，v0.60） ─────────────────────────────────────

    StarProfile:
      type: object
      description: 当前账号绑定的明星档案（starId = celebrity 域 CelebrityStar.id，双端打通根基）
      properties:
        starId:    { type: string }
        name:      { type: string }
        avatar:    { type: string }
        category:  { type: string }
        tierLabel: { type: string, description: '艺人分级：S级（≥1000万粉）/ A级（≥100万粉）/ 新晋' }
        fans:      { type: integer, format: int64 }
        agentView: { type: boolean }
        listedAt:  { type: string, format: date-time, nullable: true }
        cover:       { type: string, nullable: true, description: 'v0.62：详情字段随档案下发，供 star 端编辑表单预填' }
        description: { type: string, nullable: true }
        bio:         { type: string, nullable: true }
        location:    { type: string, nullable: true }

    # ── 数字资产平台 · 真人授权与素材送审（v0.105，dap 域）────────────────────
    DapRealAuthAgreement:
      type: object
      description: 服务端当前生效的真人数字形象授权说明；前端展示后须原样回传 version。
      required: [version, title, summary, sections, scope, periodMonths, platforms, processors, hash]
      properties:
        version:      { type: string }
        title:        { type: string }
        summary:      { type: string }
        sections:     { type: array, items: { type: string } }
        scope:        { type: string }
        periodMonths: { type: integer }
        platforms:    { type: array, items: { type: string } }
        processors:   { type: array, items: { type: string } }
        hash:          { type: string, description: 协议正文 SHA-256 摘要 }

    DapRealAuthSession:
      type: object
      description: >-
        真人授权（刷脸认证）会话 = 七牛 modelink 的 liveness_face 资产分组在本地的镜像（表 dap_material_group）。
        同一真人资产后续补素材会建立新的本地证据会话，但复用已经 active 的上游 qgroupid，不重复刷脸。
        状态：preparing（建组中）→ awaiting_auth（可去刷脸）→ validating（已回传结果、等平台判定）
        → active（授权成立）| failed。captures/{id}/verify 只在 active 时放行。
      properties:
        id:         { type: string, description: 'MG-xxxx' }
        captureId:  { type: string, nullable: true }
        avatarId:   { type: string, nullable: true }
        status:     { type: string, enum: [preparing, awaiting_auth, validating, active, failed] }
        h5Url:      { type: string, nullable: true, description: '刷脸页地址；仅 awaiting_auth 时非空，约 120s 有效，不落库' }
        failReason: { type: string, nullable: true }
        mock:       { type: boolean, description: 'true = 走内存 mock 网关（dev 联调），结论不可用于真实取证' }
        createdAt:  { type: string, format: date-time, nullable: true }
        agreementVersion: { type: string, nullable: true }
        consentRecorded:  { type: boolean, description: '是否已绑定不可变的平台授权确认快照' }

    DapMaterial:
      type: object
      description: >-
        送审素材 = 七牛 modelink 的 asset 在本地的镜像（表 dap_material）。
        refType=capture 的素材挂在 active 的 liveness 分组下；refType=avatar 走平台 aigc 默认组。
      properties:
        id:         { type: string, description: 'MAT-xxxx' }
        refType:    { type: string, enum: [avatar, capture] }
        refId:      { type: string }
        type:       { type: string, enum: [image, video, audio] }
        name:       { type: string }
        status:     { type: string, enum: [pending, reviewing, approved, failed] }
        failReason: { type: string, nullable: true }
        qassetUri:  { type: string, nullable: true, description: '生成引用格式 qasset://{qassetid}；未拿到上游 id 时为 null' }
        sourceUrl:  { type: string, nullable: true, description: '真人素材库预览用短时签名 URL；DB 真值仍为 sourceKey' }
        mock:       { type: boolean }
        createdAt:  { type: string, format: date-time, nullable: true }
        updatedAt:  { type: string, format: date-time, nullable: true }

    StarProfileUpdateInput:
      type: object
      description: 档案编辑（v0.62 从 admin 移入 star 端）；avatar / cover 留空 = 不变更
      required: [name, category, description, fans]
      properties:
        name:        { type: string }
        category:    { type: string }
        description: { type: string }
        bio:         { type: string, nullable: true }
        location:    { type: string, nullable: true }
        fans:        { type: integer, format: int64 }
        avatar:      { type: string, nullable: true }
        cover:       { type: string, nullable: true }

    StarOnboardInput:
      type: object
      required: [name, category, description, fans, startingPriceCents]
      properties:
        name:               { type: string }
        category:           { type: string }
        description:        { type: string }
        bio:                { type: string, nullable: true }
        location:           { type: string, nullable: true }
        fans:               { type: integer, format: int64 }
        startingPriceCents: { type: integer }
        agentView:          { type: boolean, nullable: true }

    StarOverview:
      type: object
      properties:
        ipActiveCount:        { type: integer }
        ipTotalCount:         { type: integer }
        pendingTotal:         { type: integer }
        productLibraryCount:  { type: integer }
        activeBrandDeals:     { type: integer }
        monthGmvCents:        { type: integer, format: int64 }
        monthGmvDeltaPercent: { type: integer }
        monthRevenueCents:    { type: integer, format: int64 }
        pendingByModule:
          type: array
          items:
            type: object
            properties:
              module: { type: string, enum: [ipAuth, cooperation, whitelist, digitalHuman, aiLikeness, contentReview, productOnboard, brandAuth] }
              count:  { type: integer }

    StarIpAsset:
      type: object
      description: IP 授权中心资产；6 状态机 notStarted→preparing→uploaded→techReceived→volcanoSync→active
      properties:
        id:               { type: string }
        type:             { type: string, enum: [portrait, clip, digitalHuman, documents] }
        status:           { type: string, enum: [notStarted, preparing, uploaded, techReceived, volcanoSync, active] }
        techCompany:      { type: string }
        volcanoProjectId: { type: string, nullable: true }
        filesCount:       { type: integer }
        requiredFiles:    { type: integer }
        uploadedAt:       { type: string, format: date, nullable: true }
        activatedAt:      { type: string, format: date, nullable: true }
        note:             { type: string, nullable: true }

    StarCooperationRequest:
      type: object
      description: 带货授权申请（后端实体即 CelebrityStarAuthorization —— celebrity↔star 打通核心）
      properties:
        id:              { type: string }
        applicantUserId: { type: string }
        applicantName:   { type: string }
        scenes:          { type: array, items: { type: string } }
        note:            { type: string, nullable: true }
        status:          { type: string, enum: [pending, authorized, unauthorized, expired] }
        requestedAt:     { type: string, format: date-time }
        decidedAt:       { type: string, format: date-time, nullable: true }
        expireDate:      { type: string, format: date, nullable: true }
        availableStyles: { type: integer, nullable: true }

    StarCooperationDecision:
      type: object
      properties:
        scenes:          { type: array, items: { type: string }, nullable: true }
        expireMonths:    { type: integer, nullable: true }
        availableStyles: { type: integer, nullable: true }
        reason:          { type: string, nullable: true, description: 驳回理由 }

    StarWhitelistRequest:
      type: object
      description: 账号报白申请；5 步 received→contacting→sms→processing→authorized
      properties:
        id:               { type: string }
        mcnName:          { type: string }
        accountHandle:    { type: string }
        accountId:        { type: string }
        phone:            { type: string, description: 已脱敏 }
        uid:              { type: string }
        platform:         { type: string, enum: [抖音, 视频号, 快手, 小红书] }
        fans:             { type: integer, format: int64 }
        accountAgeMonths: { type: integer }
        mcnLevel:         { type: string }
        requestedAt:      { type: string, format: date-time }
        status:           { type: string, enum: [pending, approved, rejected, info_required] }
        whitelistStep:    { type: string, enum: [received, contacting, sms, processing, authorized] }
        message:          { type: string, nullable: true }
        recentVideos:     { type: integer }
        avgViews:         { type: integer, format: int64 }
        creditScore:      { type: integer }

    StarDigitalHumanRequest:
      type: object
      properties:
        id:             { type: string }
        mcnName:        { type: string }
        usageType:      { type: string, enum: [live, shortVideo, ads] }
        platforms:      { type: array, items: { type: string } }
        purpose:        { type: string }
        durationMonths: { type: integer }
        requestedAt:    { type: string, format: date-time }
        status:         { type: string, enum: [pending, approved, rejected] }
        riskNote:       { type: string, nullable: true }

    StarAiLikenessRequest:
      type: object
      properties:
        id:          { type: string }
        mcnName:     { type: string }
        modelType:   { type: string, enum: [voice, face, fullBody] }
        riskLevel:   { type: string, enum: [low, medium, high] }
        platforms:   { type: array, items: { type: string } }
        purpose:     { type: string }
        requestedAt: { type: string, format: date-time }
        status:      { type: string, enum: [pending, approved, rejected] }
        aiVendor:    { type: string }

    StarContentReview:
      type: object
      properties:
        id:           { type: string }
        title:        { type: string }
        type:         { type: string, enum: [clip, digitalHuman, aiLikeness] }
        uploader:     { type: string }
        mcnName:      { type: string }
        durationSec:  { type: integer }
        submittedAt:  { type: string, format: date-time }
        status:       { type: string, enum: [pending, approved, revision, rejected] }
        platform:     { type: string }
        views:        { type: integer, format: int64, nullable: true }
        revisionNote: { type: string, nullable: true }

    StarProductOnboard:
      type: object
      description: 商品入库单；step 0=已提交 1=平台初审 2=明星审核 3=样品寄送 4=样品确认 5=已入库 6=已驳回；creator 报备来源带 productId 关联公共商品池
      properties:
        id:               { type: string }
        productId:        { type: string, nullable: true }
        productName:      { type: string }
        brand:            { type: string }
        category:         { type: string }
        priceCents:       { type: integer }
        source:           { type: string, enum: [platform, creator, brand] }
        submittedBy:      { type: string }
        mcnName:          { type: string, nullable: true }
        step:             { type: integer, minimum: 0, maximum: 6 }
        platformSample:   { $ref: '#/components/schemas/StarSampleStatus' }
        celebSample:      { $ref: '#/components/schemas/StarSampleStatus' }
        submittedAt:      { type: string, format: date-time }
        trackingPlatform: { type: string, nullable: true }
        trackingCeleb:    { type: string, nullable: true }
        platformNote:     { type: string, nullable: true }

    StarSampleStatus:
      type: string
      enum: [notSent, shipping, delivered, approved, rejected]
      description: 双路寄样状态（商品入库 / 品牌授权共用）

    StarProductLibItem:
      type: object
      description: 商品库条目（由 step=5 入库单派生）
      properties:
        id:          { type: string }
        productId:   { type: string, nullable: true }
        productName: { type: string }
        brand:       { type: string }
        category:    { type: string }
        approvedAt:  { type: string, format: date }
        priceCents:  { type: integer }
        mcnName:     { type: string }
        salesCount:  { type: integer }

    StarBrandAuthRequest:
      type: object
      description: 品牌授权；pending→platformReview→celebReview→sampleStage→approved（↘rejected），双路寄样均 approved 才激活
      properties:
        id:             { type: string }
        brandName:      { type: string }
        authTypes:      { type: array, items: { type: string } }
        purpose:        { type: string }
        durationMonths: { type: integer }
        amountCents:    { type: integer, format: int64 }
        platforms:      { type: array, items: { type: string } }
        status:         { type: string, enum: [pending, platformReview, celebReview, sampleStage, approved, rejected] }
        platformSample: { $ref: '#/components/schemas/StarSampleStatus' }
        celebSample:    { $ref: '#/components/schemas/StarSampleStatus' }
        submittedAt:    { type: string, format: date-time }
        platformNote:   { type: string, nullable: true }

    StarRevenueSummary:
      type: object
      properties:
        totalGmvCents:      { type: integer, format: int64 }
        monthGmvCents:      { type: integer, format: int64 }
        pendingAmountCents: { type: integer, format: int64 }
        paidAmountCents:    { type: integer, format: int64 }
        months:
          type: array
          items:
            type: object
            properties:
              id:           { type: string }
              month:        { type: string, example: '2026-05' }
              gmvCents:     { type: integer, format: int64 }
              sharePercent: { type: integer }
              amountCents:  { type: integer, format: int64 }
              status:       { type: string, enum: [processing, paid] }

    StarContentRule:
      type: object
      description: 内容授权规则（绿/黄/橙/红四区，所有审核动作的策略来源）
      properties:
        id:          { type: string }
        name:        { type: string }
        zone:        { type: string, enum: [green, yellow, orange, red] }
        enabled:     { type: boolean }
        description: { type: string }

    StarInfringementCase:
      type: object
      description: 侵权巡查案例；pending→investigating→confirmed→resolved（dismiss=误报直接 resolved）
      properties:
        id:          { type: string }
        platform:    { type: string }
        url:         { type: string }
        ipName:      { type: string }
        severity:    { type: string, enum: [high, medium, low] }
        status:      { type: string, enum: [pending, investigating, confirmed, resolved] }
        reportedBy:  { type: string }
        reportedAt:  { type: string, format: date-time }
        description: { type: string }
        actionNote:  { type: string, nullable: true }

    StarContract:
      type: object
      properties:
        id:          { type: string }
        title:       { type: string }
        type:        { type: string, enum: [authorization, amendment, settlement] }
        mcnName:     { type: string }
        ipName:      { type: string }
        signDate:    { type: string, format: date }
        startDate:   { type: string, format: date }
        endDate:     { type: string, format: date }
        amountCents: { type: integer, format: int64 }
        status:      { type: string, enum: [active, expired, pending, terminated] }

    StarProductFiling:
      type: object
      description: celebrity 端商品报备回执（id = StarProductOnboard.id）
      properties:
        id:          { type: string }
        productId:   { type: string }
        starId:      { type: string }
        starName:    { type: string }
        step:        { type: integer }
        stepLabel:   { type: string }
        submittedAt: { type: string, format: date-time }

# ─────────────────────────────────────────
# PATHS
# ─────────────────────────────────────────
    ClipSegment:
      type: object
      required: [no, text, role]
      properties:
        no: { type: integer }
        text: { type: string }
        role: { type: string, enum: [avatar, broll, tail] }
        hint: { type: string, nullable: true }
        durationSec: { type: number, nullable: true }
        actualDurationSec: { type: number, nullable: true }
        assetId: { type: string, nullable: true }
        assetLabel: { type: string, nullable: true }
        brollSource: { type: string, enum: [user, preset], nullable: true }
        replaceable: { type: boolean, nullable: true }

    ClipProject:
      type: object
      required: [id, templateId, templateName, title, status, variables, segments, durationSec, avatarSeconds, segmentCount, progress, step, updatedAt]
      properties:
        id: { type: string }
        templateId: { type: string }
        templateName: { type: string }
        title: { type: string }
        status: { type: string, enum: [draft, generating, done, failed] }
        variables: { type: object, additionalProperties: { type: string } }
        segments: { type: array, items: { $ref: '#/components/schemas/ClipSegment' } }
        avatarId: { type: string, nullable: true }
        voiceId: { type: string, nullable: true }
        subtitleStyle:
          type: object
          nullable: true
          description: 成片字幕与可见标识偏好；aiWatermark 缺省为 false
          properties:
            aiWatermark: { type: boolean, default: false }
          additionalProperties: true
        cover:
          type: object
          nullable: true
          description: >
            成片封面：一张 720x1280 的图，拼在成片最前面当第一帧，供抖音等平台抓取做缩略图。
            时长仅 1~2 帧，不占播放内容。可选步骤——enabled 非 true 或四个文本槽位全空即不加封面。
          properties:
            enabled: { type: boolean, default: false }
            templateId: { type: string, description: 版式模板 id；未知值回落 cover_shiti }
            keyword: { type: string, description: 顶部书法大字关键词，2 字 }
            handle: { type: string, description: 白底黑字账号名标签 }
            sloganLines:
              type: array
              maxItems: 2
              items: { type: string }
              description: 居中两行标语，白色粗体 + 黑描边
            signature: { type: string, description: 落款金句，金色渐变粗体 }
            backgroundAssetId: { type: string, nullable: true, description: 自传底图素材 id；留空则从成片抽帧 }
            backgroundSourceNo: { type: integer, description: 底图取自哪一句；0 表示服务端挑形象出镜段 }
          additionalProperties: true
        durationSec: { type: integer }
        avatarSeconds: { type: integer }
        segmentCount: { type: integer }
        progress: { type: integer }
        step: { type: integer }
        updatedAt: { type: string, format: date-time }

    ClipEstimate:
      type: object
      required: [items, total, summary]
      properties:
        items: { type: array, items: { type: object } }
        total: { type: integer }
        summary: { type: object }

    ClipJob:
      type: object
      required: [id, projectId, status, stage, progress, mock, updatedAt]
      properties:
        id: { type: string }
        projectId: { type: string }
        status: { type: string, enum: [queued, generating, assembling, succeeded, failed, cancelled] }
        stage: { type: string, enum: [tts, avatar, broll, assemble] }
        progress: { type: integer }
        workId: { type: string, nullable: true }
        errorMessage: { type: string, nullable: true }
        mock: { type: boolean }
        updatedAt: { type: string, format: date-time }

paths:

  # ── 3.1 Auth ────────────────────────────

  /auth/register:
    post:
      tags: [auth]
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, email, password]
              properties:
                username: { type: string, minLength: 3, maxLength: 50 }
                email:    { type: string, format: email }
                password: { type: string, minLength: 8 }
      responses:
        '201':
          description: 注册成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/User' }
        '400':
          description: 字段校验失败
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:    { type: string, format: email }
                password: { type: string }
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user:         { $ref: '#/components/schemas/User' }
                          accessToken:  { type: string }
                          refreshToken: { type: string }
        '401':
          description: 邮箱或密码错误
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

