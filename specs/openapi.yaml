    post: { tags: [drama], operationId: decomposeDramaShot, summary: 'v0.97 P2 镜头分解（借鉴 ViMax）：单镜画面 → 首/末帧静态快照 + 运动描述 + 变化等级（drama.decompose，计费 drama.credit.decompose）。body={desc,cast?:[名]} → {ffDesc,ffChars,lfDesc,lfChars,motionDesc,variationType,variationReason}。供首+尾帧双关键帧 i2v 提升多镜一致性。', responses: { '200': { description: ok } } }
  /me/drama/projects/{id}/shot/rewrite:
    parameters: [ { in: path, name: id, required: true, schema: { type: string } } ]
