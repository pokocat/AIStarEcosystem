  # ── 音乐真实生成（v0.138）────────────────────────
  # 异步：下单 → 轮询 → 终态。成功后服务端自动建 Song 并回填 songId。
  /me/music/generate:
    post:
      tags: [music]
      operationId: createMusicGenJob
      summary: 下单生成歌曲 / 纯音乐（真实调用音乐大模型）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateMusicGenRequest' }
      responses:
        '202':
          description: 已受理，需轮询 /me/music/jobs/{id} 直到终态
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MusicGenJob' }
        '400':
          description: 入参不合法（缺创作输入 / 时长越界 / 纯音乐与歌词冲突）。未扣费
        '402':
          description: 积分不足。未建任务
        '503':
          description: 音乐生成未配置可用模型端点（MUSIC_NOT_CONFIGURED）。未建任务、未扣费

  /me/music/jobs:
    get:
      tags: [music]
      operationId: listMusicGenJobs
      summary: 当前用户的音乐生成任务
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/MusicGenJob' }

