                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/RechargePackage' }

  /me/wallet/recharge:
    post:
      tags: [finance]
      operationId: createRechargeOrder
      summary: 充值下单（v0.56：不再直接入账，生成待确认账单；运营核准后方入账）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RechargeRequest' }
      responses:
        '200':
          description: 已创建的充值订单（PENDING）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/RechargeOrder' }

  /me/wallet/recharge/orders:
    get:
      tags: [finance]
      operationId: listMyRechargeOrders
      summary: 我的充值订单（v0.56）
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/RechargeOrder' }

  /me/wallet/recharge/orders/{orderId}/cancel:
    post:
      tags: [finance]
      operationId: cancelRechargeOrder
      summary: 取消自己的待确认充值订单（v0.56）
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/RechargeOrder' }

  /me/wallet/recharge/orders/{orderId}:
    get:
      tags: [finance]
      operationId: getRechargeOrder
      summary: 收银台轮询：取充值订单当前态（v2 §6，归属校验）
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/RechargeOrder' }

  /me/wallet/recharge/orders/{orderId}/sync:
    post:
      tags: [finance]
      operationId: syncRechargeOrder
      summary: 收银台「我已支付/刷新状态」：主动查网关→已支付则结算/超时则关单（v2 §6）
      parameters:
        - in: path
          name: orderId
          required: true
          schema: { type: string }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/RechargeOrder' }

  /me/wallet/recharge/channels:
    get:
      tags: [finance]
      operationId: getRechargeChannels
      summary: 收银台可用支付渠道（v0.94 多渠道：已启用 + 机密齐全；用户自选支付宝/微信）
      responses:
        '200':
          description: 可用渠道列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          type: object
                          properties:
                            code: { type: string, description: 'alipay / wechat / shadow' }
                            label: { type: string }
                            sandbox: { type: boolean }
                            defaultWayCode: { type: string }
                            wayCodes:
                              type: array
                              items:
                                type: object
                                properties:
                                  code: { type: string }
                                  label: { type: string }
                                  scene: { type: string, description: 'pc/wap/qr/jsapi/h5/shadow' }

  /me/wallet/recharge/checkout:
    post:
      tags: [finance]
      operationId: rechargeCheckout
      summary: 充值在线支付下单（v2：子应用内发起，后端调支付网关开单，返回 payData 拉起支付）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [packageId]
              properties:
                packageId: { type: string }
                channel: { type: string, description: 'alipay/wechat/shadow；空则取首个可用渠道（v0.94）' }
                wayCode: { type: string, description: 'ALI_PC/ALI_WAP/ALI_QR/WX_NATIVE/WX_JSAPI/WX_H5/SHADOW；空则按渠道默认' }
                openid: { type: string, description: '微信小程序 openid（WX_JSAPI 必填）' }
                sourceApp: { type: string, description: 'music/drama/celebrity/aiavatar/miniprogram（仅营销标签，不切分余额）' }
      responses:
        '200':
          description: 下单成功，返回 payData
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          orderId: { type: string }
                          payDataType: { type: string, description: 'page / qr / redirect / jsapi / shadow' }
                          payData: { type: string }

  /dev/pay/shadow/confirm:
    post:
      tags: [finance]
      operationId: shadowPayConfirm
      summary: '【dev 影子链路·仅 shadow 启用】模拟收银台确认（v2 §6.7）：success→复用 settlePaidOrder 入账 / fail→取消 / timeout→留 PENDING。生产真实渠道时此端点不注册。'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [orderId]
              properties:
                orderId: { type: string }
                result: { type: string, enum: [success, fail, timeout], default: success }
      responses:
        '200':
          description: 影子确认后的订单态
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/RechargeOrder' }

  /pay/notify/alipay:
    post:
      tags: [finance]
      operationId: alipayPayNotify
      summary: '【支付宝异步回调】permitAll + RSA2 验签（v2 §6.4 触点②，v0.94 常驻注册）：验签→trade_status 成功 + total_amount(元→分)匹配→复用 settlePaidOrder（幂等）。返回纯文本 success/fail。支付宝未启用/未配置时 verifyNotify 返回 false → fail。'
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              description: 支付宝回调参数（out_trade_no/trade_no/trade_status/total_amount/app_id/sign …）
      responses:
        '200':
          description: 纯文本 "success"（已处理 / 止重投）或 "fail"（验签或金额不符，支付宝重投）
          content:
            text/plain:
              schema: { type: string }

  /pay/notify/wechat:
    post:
      tags: [finance]
      operationId: wechatPayNotify
      summary: '【微信支付 V3 异步回调】permitAll + V3 验签 + AES-GCM 解密（v0.94，常驻注册）：解密 Transaction→trade_state SUCCESS + amount(分)匹配→复用 settlePaidOrder（幂等）。回 200 {"code":"SUCCESS"} / 5xx {"code":"FAIL"}（让微信重投）。'
      parameters:
        - { name: Wechatpay-Serial, in: header, required: false, schema: { type: string } }
        - { name: Wechatpay-Signature, in: header, required: false, schema: { type: string } }
        - { name: Wechatpay-Timestamp, in: header, required: false, schema: { type: string } }
        - { name: Wechatpay-Nonce, in: header, required: false, schema: { type: string } }
        - { name: Wechatpay-Signature-Type, in: header, required: false, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: 微信 V3 回调密文体（id/create_time/resource{ciphertext,nonce,associated_data} …）
      responses:
        '200':
          description: '{"code":"SUCCESS"}（已处理 / 止重投）'
          content:
            application/json:
              schema: { type: object, properties: { code: { type: string }, message: { type: string } } }
        '500':
          description: '{"code":"FAIL"}（验签或金额不符，微信重投）'
          content:
            application/json:
              schema: { type: object, properties: { code: { type: string }, message: { type: string } } }

  /admin/finance/recharge-orders/reconcile:
    post:
      tags: [finance]
      operationId: reconcileRechargeOrders
      summary: '【FINANCE_ADMIN/SUPER_ADMIN】手动触发查单兜底（v2 §6.4，直连方案）：对 PENDING 在线订单逐单查网关,已支付则幂等结算。回调丢失/本地无公网时补单。'
      responses:
        '200':
          description: 本轮新结算的订单数
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      settled: { type: integer }

  /me/ledger:
    get:
      tags: [finance]
      operationId: listMyLedger
      summary: 当前用户的不可变流水（分页）
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 20 }
      responses:
        '200':
