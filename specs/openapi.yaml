  /me/songs:
    get:
      tags: [music]
      operationId: listMySongs
      summary: 当前用户的歌曲（替代 legacy /tracks）
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
