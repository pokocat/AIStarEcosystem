    post:
      tags: [star, celebrity]
      operationId: celebrityFileProductToStar
      description: 把公共商品池商品报备给明星 → web-star「商品入库」step=2 明星审核
      parameters: [{ in: path, name: productId, required: true, schema: { type: string } }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [starId]
              properties:
                starId: { type: string }
      responses:
        '201': { description: created }
        '409': { description: FILING_ALREADY_EXISTS }
  /me/celebrity/star-filings:
    get:
      tags: [star, celebrity]
      operationId: celebrityListStarFilings
      description: 我的商品报备单（celebrity 端回查 6 步流转状态）
      parameters:
        - { in: query, name: productId, schema: { type: string } }
        - { in: query, name: starId, schema: { type: string } }
      responses: { '200': { description: ok } }

  # ── 数字分身口播成片（军师 BFF service token + externalOwnerId）────────────
  # 这些端点不接受普通用户 JWT。Controller 对 Authorization service token 做常量时间比较，
  # 并用 X-External-Owner-Id 作为 clip 表的强属主过滤条件。
  /me/clip/templates:
    get: { tags: [clip], security: [{ clipServiceAuth: [], clipExternalOwner: [] }], operationId: clipListTemplates, responses: { '200': { description: published templates } } }
  /me/clip/templates/{id}:
    get: { tags: [clip], security: [{ clipServiceAuth: [], clipExternalOwner: [] }], operationId: clipGetTemplate, parameters: [{ in: path, name: id, required: true, schema: { type: string } }], responses: { '200': { description: template } } }
  /me/clip/projects:
    get: { tags: [clip], security: [{ clipServiceAuth: [], clipExternalOwner: [] }], operationId: clipListProjects, responses: { '200': { description: owned projects } } }
    post:
      tags: [clip]
      security: [{ clipServiceAuth: [], clipExternalOwner: [] }]
      operationId: clipCreateProject
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [templateId], properties: { templateId: { type: string } } } } } }
      responses: { '200': { description: created project } }
  /me/clip/projects/ongoing:
    get: { tags: [clip], security: [{ clipServiceAuth: [], clipExternalOwner: [] }], operationId: clipOngoingProject, responses: { '200': { description: latest draft or null } } }
  /me/clip/projects/{id}:
    get: { tags: [clip], security: [{ clipServiceAuth: [], clipExternalOwner: [] }], operationId: clipGetProject, parameters: [{ in: path, name: id, required: true, schema: { type: string } }], responses: { '200': { description: project } } }
    put: { tags: [clip], security: [{ clipServiceAuth: [], clipExternalOwner: [] }], operationId: clipSaveProject, parameters: [{ in: path, name: id, required: true, schema: { type: string } }], responses: { '200': { description: saved project } } }
    delete: { tags: [clip], security: [{ clipServiceAuth: [], clipExternalOwner: [] }], operationId: clipDeleteProject, parameters: [{ in: path, name: id, required: true, schema: { type: string } }], responses: { '200': { description: moved to trash } } }
  /me/clip/projects/{id}/restore:
    post: { tags: [clip], security: [{ clipServiceAuth: [], clipExternalOwner: [] }], operationId: clipRestoreProject, parameters: [{ in: path, name: id, required: true, schema: { type: string } }], responses: { '200': { description: restored } } }
  /me/clip/projects/{id}/purge:
    post: { tags: [clip], security: [{ clipServiceAuth: [], clipExternalOwner: [] }], operationId: clipPurgeProject, parameters: [{ in: path, name: id, required: true, schema: { type: string } }], responses: { '200': { description: permanently deleted } } }
  /me/clip/projects/{id}/script/reset:
    post: { tags: [clip], security: [{ clipServiceAuth: [], clipExternalOwner: [] }], operationId: clipResetScript, parameters: [{ in: path, name: id, required: true, schema: { type: string } }], responses: { '200': { description: template script restored } } }
  /me/clip/projects/{id}/script/ai-rewrite:
    post:
      tags: [clip]
      security: [{ clipServiceAuth: [], clipExternalOwner: [] }]
      operationId: clipRewriteScript
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [scope], properties: { scope: { type: string, enum: [all, segment] }, no: { type: integer, nullable: true }, text: { type: string, nullable: true } } } } } }
      responses: { '200': { description: rewrite result }, '503': { description: production engine or prompt route not configured } }
  /me/clip/projects/{id}/preview-voice:
    post: { tags: [clip], security: [{ clipServiceAuth: [], clipExternalOwner: [] }], operationId: clipPreviewVoice, parameters: [{ in: path, name: id, required: true, schema: { type: string } }], responses: { '200': { description: TTS preview and actual duration } } }
  /me/clip/projects/{id}/estimate:
    post: { tags: [clip], security: [{ clipServiceAuth: [], clipExternalOwner: [] }], operationId: clipEstimate, parameters: [{ in: path, name: id, required: true, schema: { type: string } }], responses: { '200': { description: authoritative quote }, '503': { description: pricing not configured } } }
  /me/clip/projects/{id}/render:
    post:
      tags: [clip]
      security: [{ clipServiceAuth: [], clipExternalOwner: [] }]
      operationId: clipRender
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [clientRequestId, externalCreditsHeld], properties: { clientRequestId: { type: string }, externalCreditsHeld: { type: integer } } } } } }
      responses: { '200': { description: queued idempotent job }, '409': { description: avatar voice or quote changed }, '503': { description: engine not configured } }
  /me/clip/jobs/by-request/{clientRequestId}:
    get: { tags: [clip], security: [{ clipServiceAuth: [], clipExternalOwner: [] }], operationId: clipGetJobByClientRequest, parameters: [{ in: path, name: clientRequestId, required: true, schema: { type: string } }], responses: { '200': { description: owner-scoped idempotent render result }, '404': { description: no accepted job for this owner and request id } } }
  /me/clip/jobs/{id}:
    get: { tags: [clip], security: [{ clipServiceAuth: [], clipExternalOwner: [] }], operationId: clipGetJob, parameters: [{ in: path, name: id, required: true, schema: { type: string } }], responses: { '200': { description: job progress } } }
  /me/clip/jobs/{id}/cancel:
    post: { tags: [clip], security: [{ clipServiceAuth: [], clipExternalOwner: [] }], operationId: clipCancelJob, parameters: [{ in: path, name: id, required: true, schema: { type: string } }], responses: { '200': { description: cooperatively cancelled } } }
  /me/clip/assets:
    get: { tags: [clip], security: [{ clipServiceAuth: [], clipExternalOwner: [] }], operationId: clipListAssets, responses: { '200': { description: owned and preset assets; previewUrl is a list image while contentUrl is the signed original media URL opened only on explicit preview; width/height are pixel dimensions and are OMITTED (never 0) when unknown } } }
    post:
      tags: [clip]
      security: [{ clipServiceAuth: [], clipExternalOwner: [] }]
      operationId: clipUploadAsset
      description: >-
        width/height are the client-reported pixel dimensions and are used ONLY as a fallback when the
        server-side ffprobe cannot read them. Omit them rather than sending 0 — 0 would be stored as an
        unknown-looking real value.
      requestBody: { required: true, content: { multipart/form-data: { schema: { type: object, required: [file, kind], properties: { file: { type: string, format: binary }, kind: { type: string, enum: [video, image, bgm] }, label: { type: string }, width: { type: integer, nullable: true }, height: { type: integer, nullable: true } } } } } }
      responses: { '200': { description: uploaded }, '400': { description: CLIP_ASSET_NOT_ALLOWED } }
  /me/clip/assets/storage:
    get: { tags: [clip], security: [{ clipServiceAuth: [], clipExternalOwner: [] }], operationId: clipAssetStorage, responses: { '200': { description: owner usedBytes and asset count against the limitBytes quota; preset assets are platform-provided and excluded } } }
  /me/clip/assets/{id}:
    patch: { tags: [clip], security: [{ clipServiceAuth: [], clipExternalOwner: [] }], operationId: clipUpdateAsset, parameters: [{ in: path, name: id, required: true, schema: { type: string } }], responses: { '200': { description: updated label } } }
    delete: { tags: [clip], security: [{ clipServiceAuth: [], clipExternalOwner: [] }], operationId: clipDeleteAsset, parameters: [{ in: path, name: id, required: true, schema: { type: string } }], responses: { '200': { description: owned object and row deleted } } }
  /me/clip/works:
    get: { tags: [clip], security: [{ clipServiceAuth: [], clipExternalOwner: [] }], operationId: clipListWorks, responses: { '200': { description: 'generating done and published works; returns createdAt and generatedAt, completed rows best-effort backfill thumbnailUrl from the final MP4, and exposes aiWatermark (default false)' } } }
  /me/clip/works/{id}:
    get: { tags: [clip], security: [{ clipServiceAuth: [], clipExternalOwner: [] }], operationId: clipGetWork, parameters: [{ in: path, name: id, required: true, schema: { type: string } }], responses: { '200': { description: work including generation timestamps and aiWatermark preference } } }
    delete: { tags: [clip], security: [{ clipServiceAuth: [], clipExternalOwner: [] }], operationId: clipDeleteWork, parameters: [{ in: path, name: id, required: true, schema: { type: string } }], responses: { '200': { description: 'active render jobs cancelled, their ids returned for caller-side billing settlement, and work moved to 30-day trash retention' } } }
  /me/clip/works/{id}/publish:
    post:
      tags: [clip]
      security: [{ clipServiceAuth: [], clipExternalOwner: [] }]
      operationId: clipPublishWork
      description: 只支持抖音、快手、小红书、视频号；不承诺其它平台。
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [platform], properties: { platform: { type: string, enum: [douyin, kuaishou, xiaohongshu, shipinhao] } } } } } }
      responses: { '200': { description: submitted } }
  /me/clip/avatar:
    get: { tags: [clip], security: [{ clipServiceAuth: [], clipExternalOwner: [] }], operationId: clipGetAvatar, responses: { '200': { description: 'aggregate image and voice engine state with upstream progress, failure messages, imagePreviewUrl, and voiceSource=video|dedicated' } } }
    delete: { tags: [clip], security: [{ clipServiceAuth: [], clipExternalOwner: [] }], operationId: clipDeleteAvatar, responses: { '200': { description: upstream deletion requested and local assets soft deleted } } }
  /me/clip/account:
    delete: { tags: [clip], security: [{ clipServiceAuth: [], clipExternalOwner: [] }], operationId: clipDeleteAccountData, responses: { '200': { description: retention-expiry purge of all owner clip projects, jobs, assets, avatars, voices, and stored media } } }
  /me/clip/avatars:
    get: { tags: [clip], security: [{ clipServiceAuth: [], clipExternalOwner: [] }], operationId: clipListAvatars, responses: { '200': { description: all active avatars with id name preview and linkedVoiceId/linkedVoiceName } } }
  /me/clip/avatars/{id}:
    get: { tags: [clip], security: [{ clipServiceAuth: [], clipExternalOwner: [] }], operationId: clipGetAvatarById, parameters: [{ in: path, name: id, required: true, schema: { type: string } }], responses: { '200': { description: exact avatar and linked voice state } } }
    delete: { tags: [clip], security: [{ clipServiceAuth: [], clipExternalOwner: [] }], operationId: clipDeleteAvatarById, parameters: [{ in: path, name: id, required: true, schema: { type: string } }], responses: { '200': { description: exact avatar upstream deletion requested and local image assets soft deleted; reusable voice remains available } } }
  /me/clip/voices:
    get: { tags: [clip], security: [{ clipServiceAuth: [], clipExternalOwner: [] }], operationId: clipListVoices, responses: { '200': { description: reusable voice profiles with training state and source } } }
  /me/clip/voices/{id}:
    patch: { tags: [clip], security: [{ clipServiceAuth: [], clipExternalOwner: [] }], operationId: clipRenameVoice, parameters: [{ in: path, name: id, required: true, schema: { type: string } }], requestBody: { required: true, content: { application/json: { schema: { type: object, required: [name], properties: { name: { type: string } } } } } }, responses: { '200': { description: renamed reusable voice } } }
  /me/clip/voices/{id}/preview:
    post: { tags: [clip], security: [{ clipServiceAuth: [], clipExternalOwner: [] }], operationId: clipPreviewVoiceById, description: "给一段文字让这条声音念出来（石榴 POST /speaker/tts）。不依赖 project —— 训练完当场就要能听，别逼用户先建项目。不产生计费对象；限流在军师 BFF 侧。", parameters: [{ in: path, name: id, required: true, schema: { type: string } }], requestBody: { required: true, content: { application/json: { schema: { type: object, required: [text], properties: { text: { type: string, maxLength: 200 } } } } } }, responses: { '200': { description: "synthesized audition audio for this voice" } } }
  /me/clip/avatar/requirements:
    get:
      tags: [clip]
      security: [{ clipServiceAuth: [], clipExternalOwner: [] }]
      operationId: clipAvatarCaptureRequirements
      description: 返回石榴官方硬限制与本产品采集建议；客户端必须展示并按 productMaxBytes/productMinDurationSec 做前置校验，服务端仍以 ffprobe 结果为准。
      responses: { '200': { description: consent/avatar/voice capture rules and the exact consent script } }
  /me/clip/avatar/consent:
    post:
      tags: [clip]
      security: [{ clipServiceAuth: [], clipExternalOwner: [] }]
      operationId: clipStartConsent
      description: 上传本人正脸授权声明视频；口播必须与服务端固定授权文案逐字一致。石榴受理后原始文件由我方删除，只保留授权文本哈希与 authId。authId 表示供应商已受理授权证据，不等同于独立实名认证。
      requestBody: { required: true, content: { multipart/form-data: { schema: { type: object, required: [file, text], properties: { file: { type: string, format: binary }, text: { type: string, maxLength: 300 } } } } } }
      responses: { '200': { description: authorization video submitted and accepted by the upstream endpoint; accepted permits clone }, '503': { description: media moderation or engine not configured } }
  /me/clip/avatar/uploads:
    post:
      tags: [clip]
      security: [{ clipServiceAuth: [], clipExternalOwner: [] }]
      operationId: clipCreateCloneUpload
      description: 签发 10 分钟、精确 object key/字节数/MIME 的 OSS V4 PostObject 票据；owner + clientRequestId 幂等，长期密钥不下发。
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [kind, clientRequestId, fileName, contentType, sizeBytes], properties: { kind: { type: string, enum: [avatar, voice, avatarImage] }, clientRequestId: { type: string }, fileName: { type: string }, contentType: { type: string }, sizeBytes: { type: integer, format: int64 } } } } } }
      responses: { '200': { description: restricted direct-upload ticket or the existing idempotent session state }, '409': { description: same clientRequestId was used for a different file } }
  /me/clip/avatar/uploads/{id}/complete:
    post:
      tags: [clip]
      security: [{ clipServiceAuth: [], clipExternalOwner: [] }]
      operationId: clipCompleteCloneUpload
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      description: HEAD 核对对象精确大小与 MIME；不创建供应商任务。
      responses: { '200': { description: uploaded or terminal session status }, '422': { description: object metadata mismatch } }
  /me/clip/avatar/uploads/{id}/submit:
    post:
      tags: [clip]
      security: [{ clipServiceAuth: [], clipExternalOwner: [] }]
      operationId: clipSubmitCloneUpload
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      description: 将已核验对象落 processing 后异步做真实媒体校验、H.265 转 H.264 和供应商受理；重复提交返回同一状态。
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [clientRequestId], properties: { clientRequestId: { type: string }, avatarId: { type: string }, voiceId: { type: string }, name: { type: string }, voiceSource: { type: string } } } } } }
      responses: { '200': { description: processing accepted or failed status }, '409': { description: upload not completed or request id mismatch } }
  /me/clip/avatar/uploads/{id}:
    get:
      tags: [clip]
      security: [{ clipServiceAuth: [], clipExternalOwner: [] }]
      operationId: clipGetCloneUpload
      parameters: [{ in: path, name: id, required: true, schema: { type: string } }]
      responses: { '200': { description: issued uploaded processing accepted or failed status } }
  /me/clip/avatar/clone:
    post:
      tags: [clip]
      security: [{ clipServiceAuth: [], clipExternalOwner: [] }]
      operationId: clipCloneAvatarOrVoice
      requestBody: { required: true, content: { multipart/form-data: { schema: { type: object, required: [file, kind], properties: { file: { type: string, format: binary }, kind: { type: string, enum: [avatar, voice, avatarImage] }, avatarId: { type: string, description: replace or attach voice to this avatar }, voiceId: { type: string, description: existing ready voice reused by a new avatar }, name: { type: string, maxLength: 32 } } } } } }
      responses: { '200': { description: training started and returns avatarId/voiceId when available; avatar upload also persists a preview frame }, '422': { description: invalid media or CLIP_AVATAR_PREVIEW_FAILED } }
  /me/clip/avatar/consents:
    get: { tags: [clip], security: [{ clipServiceAuth: [], clipExternalOwner: [] }], operationId: clipConsentLogs, responses: { '200': { description: consent snapshots } } }
  /me/clip/avatar/usages:
    get: { tags: [clip], security: [{ clipServiceAuth: [], clipExternalOwner: [] }], operationId: clipUsageLogs, responses: { '200': { description: generation usage logs } } }
  /admin/clip/templates:
    get: { tags: [admin, clip], operationId: adminClipTemplates, responses: { '200': { description: all templates including tailClips asset name duration preview and content URL } } }
    post: { tags: [admin, clip], operationId: adminCreateClipTemplate, responses: { '200': { description: created } } }
  /admin/clip/templates/{id}:
    put: { tags: [admin, clip], operationId: adminUpdateClipTemplate, parameters: [{ in: path, name: id, required: true, schema: { type: string } }], responses: { '200': { description: updated } } }
    delete: { tags: [admin, clip], operationId: adminDeleteClipTemplate, parameters: [{ in: path, name: id, required: true, schema: { type: string } }], responses: { '200': { description: soft deleted } } }
  /admin/clip/vendor/overview:
    get:
      tags: [admin, clip]
      operationId: adminClipVendorOverview
      description: >-
        石榴 AI 供应商总览（只读）。额度快照 + 石榴侧 avatar/speaker 清单 + 与 dap_avatar.engine_ref /
        dap_voice.engine_ref 的对账（matched 正常 / orphan 孤儿：石榴有我方无，可清理 /
        dangling 悬挂：我方有石榴无，上游已删本地未同步 / unmatchable：训练中或 mock 残留，不参与对账）。
        quota.availableAvatar 与 availableSpeaker 是「可持有数量的剩余槽位」（实证推断，供应商文档未写明），
        归零表示必须先删旧对象才能再建。任一分段读失败时该段 error 非 null 且 vendorCount 为 null，
        列表一律为空 —— 表示「没读到」而非「石榴侧是空的」，前端不得渲染成空态。本视图不提供删除。
      responses:
        '200': { description: 'quota snapshot, vendor object lists and DB reconciliation' }
        '503': { description: CLIP_ENGINE_NOT_CONFIGURED — 石榴 baseUrl/token 未配置，无对账基准 }
  /admin/clip/preset-assets:
    post:
      tags: [admin, clip]
      operationId: adminUploadClipPresetAsset
      description: 预置素材必须经本运营上传路由进入存储，不允许 seed 本机路径。
      requestBody: { required: true, content: { multipart/form-data: { schema: { type: object, required: [file, kind], properties: { file: { type: string, format: binary }, kind: { type: string, enum: [video, image, bgm] }, label: { type: string }, group: { type: string } } } } } }
      responses: { '200': { description: preset asset uploaded } }
