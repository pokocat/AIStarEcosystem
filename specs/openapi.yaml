  # v0.53：已登录账号「追加激活」秘钥 —— 合并开通批次绑定的子应用 + 追加发放积分。
  # 与 /auth/activate（注册新账号）互补；批次 platforms 非空时按批次授权（优先于注册来源策略）。
  /me/license/activate:
    post:
      tags: [auth]
      operationId: appendActivateLicense
      summary: 已登录账号追加激活秘钥（开通批次绑定子应用 + 发放积分）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
      responses:
        '200':
          description: 追加激活成功（返回 user / creditsGranted / newTotalBalance / platformsGranted）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /auth/dev-accounts:
    get:
      tags: [auth]
      operationId: devAccounts
      security: []
      summary: '[dev only] 获取测试账号列表'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'

  /auth/dev-login:
    post:
      tags: [auth]
      operationId: devLogin
      security: []
      summary: '[dev only] 直接以测试账号登录'
      responses:
        '200':
          description: ok

  # v0.31+ 手机号 + SMS 验证码 登录 / 注册（三个新 web app + 小程序入口）
  /auth/sms/request-code:
    post:
      tags: [auth]
      operationId: smsRequestCode
      security: []
      summary: 请求短信验证码（登录 / 注册模板分离；速率限制 60s/次；连错 5 次锁定 30 分钟）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone: { type: string, description: 11 位国内手机号 }
                purpose:
                  type: string
                  enum: [login, register]
                  default: login
                  description: 验证码用途；login 使用登录模板 SMS_507065062，register 使用注册模板
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          sent: { type: boolean }
        '400': { description: 手机号格式错误 }
        '429': { description: 速率限制 / 已锁定 }

  /auth/sms/verify:
    post:
      tags: [auth]
      operationId: smsLogin
      security: []
      summary: 手机号 + 验证码 登录（用户必须已注册）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, code]
              properties:
                phone: { type: string }
                code: { type: string, description: 6 位数字 }
      responses:
        '200':
          description: 登录成功，返回 token + user
        '400': { description: 验证码错误 / 过期 }
        '404':
          description: >-
            USER_NOT_FOUND — 手机号未注册，需走 /auth/sms/register。
            error.details 携带 { registerTicket, phone }：手机号已通过短信验证，
            前端可凭 registerTicket 在注册时免重输验证码（10 分钟内有效）。
        '429': { description: 已锁定 }

  /auth/sms/register:
    post:
      tags: [auth]
      operationId: smsRegister
      security: []
      summary: 手机号 + 激活码 双因素注册（同时创建 STUDIO 账号 + 工作室 + 钱包）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, licenseKey, studioName]
              description: >-
                手机号所有权证明二选一：带有效 registerTicket（验证码登录刚验过的凭证）
                可省略 code；否则必须传 register 用途的短信验证码 code。
              properties:
                phone: { type: string }
                code:
                  type: string
                  description: 短信验证码（register 用途）。带 registerTicket 时可省略。
                registerTicket:
                  type: string
                  description: >-
                    /auth/sms/verify 在 404 USER_NOT_FOUND 时回带的注册凭证；
                    带它即证明手机号已验证，免重输验证码。
                licenseKey: { type: string, description: License 激活码 }
                studioName: { type: string }
                displayName: { type: string }
                platform:
                  type: string
                  enum: [music, drama, celebrity, aiavatar]
                  description: 注册来源子产品；后端据此授予平台访问权
      responses:
        '200':
          description: 注册并登录成功
        '400': { description: 参数缺失 / 验证码 / 激活码错误 }
        '401': { description: REGISTER_TICKET_EXPIRED — 注册凭证无效或已过期，需重新获取验证码 }
        '409': { description: 该手机号已注册 / 激活码已使用 }

  /auth/password/login:
    post:
      tags: [auth]
      operationId: passwordLogin
      security: []
      summary: 手机号 + 密码登录（密码需登录后在账号安全页设置）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, password]
              properties:
                phone: { type: string, description: 已注册手机号 }
                password: { type: string, minLength: 6 }
      responses:
        '200':
          description: 登录成功，返回 token + user
        '400': { description: 手机号或密码缺失 }
        '401': { description: 手机号或密码错误 }
        '403': { description: PASSWORD_NOT_SET / ACCOUNT_DISABLED }

  # v0.31+ admin 端：管理 AepUser.operatorRole 字段（内嵌运营角色）
  /admin/aep-users:
    get:
      tags: [admin-account]
      operationId: adminListAepUsers
      parameters:
        - in: query
          name: q
          schema: { type: string, description: 模糊匹配 username/displayName/phone/email }
        - in: query
          name: hasOperator
          schema: { type: boolean, description: true=仅运营 false=仅普通 null=全部 }
      responses:
        '200':
          description: ok

  /admin/aep-users/{id}/operator-role:
    patch:
      tags: [admin-account]
      operationId: adminUpdateAepUserOperatorRole
      summary: 改某账号的 operatorRole（OPERATOR / SUPER_ADMIN / null）
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                operatorRole:
                  type: string
                  nullable: true
                  enum: [operator, super_admin, null]
      responses:
        '200': { description: ok }
        '404': { description: USER_NOT_FOUND }

  # v0.53：子产品平台访问授权（SUPER_ADMIN）。空数组/null = 全平台。
  /admin/aep-users/{id}/platforms:
    patch:
      tags: [admin-account]
      operationId: adminUpdateAepUserPlatforms
      summary: 改某账号可访问的子产品平台（music/drama/celebrity/aiavatar）
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                platforms:
                  type: array
                  nullable: true
                  items:
                    type: string
                    enum: [music, drama, celebrity, aiavatar]
      responses:
        '200': { description: ok（返回 AepUser） }
        '404': { description: USER_NOT_FOUND }

  # ── v0.53（审计 #9）：秘钥批次 / 单码 admin 管理（AdminLicenseController） ─────

  /admin/license-batches:
    get:
      tags: [admin-license]
      operationId: adminListLicenseBatches
      summary: 秘钥批次分页列表（核销/总量为 keys 表实时派生值）
      parameters:
        - { in: query, name: page, schema: { type: integer, default: 0 } }
        - { in: query, name: size, schema: { type: integer, default: 20 } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/LicenseBatch' }
    post:
      tags: [admin-license]
      operationId: adminCreateLicenseBatch
      summary: 新建批次（同时预铸 totalCount 把秘钥；明文不返回，需另走 mint-keys）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, totalCount]
              properties:
                name: { type: string }
                sellingChannelId: { type: string, description: 与 issuerTenantId 二选一（新批次必填本字段） }
                issuerTenantId: { type: string, description: 老路径保留 }
                tier:
                  type: string
                  nullable: true
                  enum: [trial, basic, standard, premium, annual_pro, city_agent]
                platforms:
                  type: array
                  description: v0.53：可激活子应用；缺失/空 = 全站可用
                  items: { type: string, enum: [music, drama, celebrity, aiavatar] }
                initialCreditGrant: { type: integer, format: int64 }
                totalCount: { type: integer }
                validFrom: { type: string, format: date-time }
                validTo: { type: string, format: date-time }
      responses:
        '201':
          description: created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/LicenseBatch' }

  /admin/license-batches/{id}:
    get:
      tags: [admin-license]
      operationId: adminGetLicenseBatch
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/LicenseBatch' }
        '404': { description: not found }

  /admin/license-batches/{id}/keys:
    get:
      tags: [admin-license]
      operationId: adminListLicenseKeysByBatch
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: query, name: page, schema: { type: integer, default: 0 } }
        - { in: query, name: size, schema: { type: integer, default: 20 } }
        - { in: query, name: status, schema: { type: string, enum: [created, activated, expired, revoked] } }
      responses:
        '200': { description: ok（PageEnvelope<LicenseKey>） }

  /admin/license-batches/{id}/mint-keys:
    post:
      tags: [admin-license]
      operationId: adminMintLicenseKeys
      summary: 在批次下追加铸码（1..100；明文 raw codes 仅本次响应返回，DB 只存 sha256）
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
        - { in: query, name: count, schema: { type: integer, default: 1, minimum: 1, maximum: 100 } }
      responses:
        '200':
          description: 'ok（{ batchId, count, rawCodes[] }）'
        '409': { description: 批次状态非 ACTIVE }

  /admin/license-keys:
    get:
      tags: [admin-license]
      operationId: adminListLicenseKeys
      parameters:
        - { in: query, name: page, schema: { type: integer, default: 0 } }
        - { in: query, name: size, schema: { type: integer, default: 20 } }
        - { in: query, name: batchId, schema: { type: string } }
        - { in: query, name: status, schema: { type: string, enum: [created, activated, expired, revoked] } }
      responses:
        '200': { description: ok（PageEnvelope<LicenseKey>） }

  /admin/license-keys/{id}/revoke:
    put:
      tags: [admin-license]
      operationId: adminRevokeLicenseKey
      summary: 吊销秘钥（已激活的会反向递减批次核销计数）
      parameters:
        - { in: path, name: id, required: true, schema: { type: string } }
      responses:
        '200': { description: ok }
        '404': { description: not found }

  # ── 3.x.2 当前用户域 /me/** ─────────────────────────

  /me:
    get:
      tags: [account]
      operationId: getMe
      summary: 获取当前用户档案
      responses:
        '200': { description: ok }
    patch:
      tags: [account]
      operationId: updateMyProfile
      summary: 更新当前用户可编辑资料（displayName/avatarUrl/phone/email/bio/langPreference）
      responses:
        '200': { description: ok }

  /me/password:
    post:
      tags: [account]
      operationId: changeMyPassword
      summary: 当前登录用户设置或修改登录密码；首次设置可不传 currentPassword
      requestBody:
        required: true
