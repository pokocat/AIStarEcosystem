  # v0.43：形象锻造对话（大模型优先，Coze 回退）。/coze/* 保留为同行为别名。music + drama 共用。
  /appearance-forge/chat/status: { get:  { tags: [forge], operationId: getForgeChatStatus, responses: { '200': { description: 'provider: llm|coze|mock|none' } } } }
  /appearance-forge/chat/stream: { post: { tags: [forge], operationId: streamForgeChat, summary: 形象锻造流式对话（SSE）, responses: { '200': { description: 'text/event-stream：status/delta/message/completed/done' } } } }

  # ── 短剧生成（drama 子产品；脚本化 → 视频）v0.43 ─────
  # 脚本结构见 apps/web-drama/src/api/short-drama.ts（scenes[]：heading/summary/shot/dialogue/duration_sec）。
  # 视频生成复用 material_video_job（kind=drama-episode）。鉴权：/api/me/** authenticated。
  /me/drama/scripts:
    get:  { tags: [drama], operationId: listDramaScripts, responses: { '200': { description: ok } } }
    post: { tags: [drama], operationId: saveDramaScript,  responses: { '200': { description: ok } } }
  /me/drama/scripts/{id}:
    get:    { tags: [drama], operationId: getDramaScript,    parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: ok } } }
    delete: { tags: [drama], operationId: deleteDramaScript, parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '204': { description: deleted } } }
  /me/drama/scripts/ai-draft:    { post: { tags: [drama], operationId: aiDraftDramaScripts, summary: AI 起草分场景短剧脚本（大模型）, responses: { '200': { description: 'ok；未配置 → 503 AI_NOT_CONFIGURED' } } } }
  /me/drama/episodes/generate:   { post: { tags: [drama], operationId: generateDramaEpisodes, summary: 由脚本生成短剧视频（异步 submit）, responses: { '200': { description: 'ok（status=rendering 任务卡）' } } } }
  /me/drama/episodes/jobs:       { get:  { tags: [drama], operationId: listDramaEpisodeJobs, parameters: [{ name: script_id, in: query, required: false, schema: { type: string } }], responses: { '200': { description: ok } } } }
  /me/drama/episodes/jobs/{id}:  { get:  { tags: [drama], operationId: getDramaEpisodeJob, parameters: [{ name: id, in: path, required: true, schema: { type: string } }], responses: { '200': { description: ok } } } }

  # ── mixcut（混剪专区 · web-celebrity 子模块） ─────
  # 完整 schema 见 apps/web-celebrity/src/components/mixcut-zone/types.ts。
  # 鉴权：/api/mixcut/** 全部 .authenticated()；dev profile 走 DevAutoAuthFilter 兜底。

  /mixcut/jobs:
    get:  { tags: [mixcut], operationId: listMixcutJobs,  responses: { '200': { description: ok } } }
    post: { tags: [mixcut], operationId: createMixcutJob, responses: { '200': { description: ok } } }

  /mixcut/jobs/{jobId}:
    parameters:
      - { in: path, name: jobId, required: true, schema: { type: string } }
    get: { tags: [mixcut], operationId: getMixcutJob, responses: { '200': { description: ok } } }

  /mixcut/jobs/{jobId}/progress:
    parameters:
      - { in: path, name: jobId, required: true, schema: { type: string } }
    patch: { tags: [mixcut], operationId: updateMixcutJobProgress, responses: { '200': { description: ok } } }

  # v0.30+: 基于原 job 完整快照 fork 出新 job。仅可覆盖 output_variants / perturbation_profile。
  # 409 MISSING_ASSETS → error.details.missing_assets[] 列出已删素材；前端切错误态。
  /mixcut/jobs/{jobId}/rerun:
    parameters:
      - { in: path, name: jobId, required: true, schema: { type: string } }
    post: { tags: [mixcut], operationId: rerunMixcutJob, responses: { '200': { description: ok } } }

  # v0.50+: 从已有任务创建实例（用于改进后的「重跑」入口）。
  # 若任务已有 draft_id → 直接返回现有实例；否则 → 从任务快照创建新实例。
  # 调用方跳转 /mixcut/create/{templateId}?draft_id={id} 让用户可编辑后再生成。
  # 404 MIXCUT_JOB_NOT_FOUND → job 不存在或不属于当前用户。
  /mixcut/jobs/{jobId}/create-draft:
    parameters:
      - { in: path, name: jobId, required: true, schema: { type: string } }
    post: { tags: [mixcut], operationId: createDraftFromJob, responses: { '200': { description: ok } } }

  /mixcut/assets:
    get:  { tags: [mixcut], operationId: listMixcutAssets,  responses: { '200': { description: ok } } }
    post: { tags: [mixcut], operationId: uploadMixcutAsset, responses: { '200': { description: ok } } }

  /mixcut/assets/{assetId}:
    parameters:
      - { in: path, name: assetId, required: true, schema: { type: string } }
    get:    { tags: [mixcut], operationId: getMixcutAsset,    responses: { '200': { description: ok } } }
    delete: { tags: [mixcut], operationId: deleteMixcutAsset, responses: { '200': { description: ok } } }

  # v0.21+: 已生成视频（render output）软删
  # 用户在「我的视频库」点删除会调此端点；server 把 MixcutRenderOutput.deleted_at 置非空，
  # 列表 dto 立即过滤掉该 output；30 天后由 MixcutOutputCleanupScheduler 物理清理。
  /mixcut/outputs/{outputId}:
    parameters:
      - { in: path, name: outputId, required: true, schema: { type: string } }
    delete: { tags: [mixcut], operationId: deleteMixcutOutput, responses: { '200': { description: ok } } }

  # v0.21+: 官方明星片段（运营后台上传，用户只读消费）
  # is_official=true 的 MixcutAsset；按 category（直播切片/综艺/访谈等）/ star_id 过滤。
  /mixcut/assets/official-clips:
    get:
      tags: [mixcut]
      operationId: listOfficialClips
      parameters:
        - { in: query, name: category, schema: { type: string } }
        - { in: query, name: star_id,  schema: { type: string } }
      responses: { '200': { description: ok } }

  /mixcut/templates:
    get: { tags: [mixcut], operationId: listMixcutTemplates, responses: { '200': { description: ok } } }

  /mixcut/templates/{templateId}:
    parameters:
      - { in: path, name: templateId, required: true, schema: { type: string } }
    get:    { tags: [mixcut], operationId: getMixcutTemplate,    responses: { '200': { description: ok } } }
    put:    { tags: [mixcut], operationId: upsertMixcutTemplate, responses: { '200': { description: ok } } }
    delete: { tags: [mixcut], operationId: deleteMixcutTemplate, responses: { '200': { description: ok } } }

  # v0.48+: 实例 / 草稿（模版 → 实例 → 生成任务 中间层）。
  # 用户保存填了一半的配置为实例，可继续编辑 / 反复生成；生成的任务带 draft_id 指回实例。
  # 全部 user-private，按 principal 隔离。
  /mixcut/drafts:
    get:  { tags: [mixcut], operationId: listMixcutDrafts,  responses: { '200': { description: ok } } }
    post: { tags: [mixcut], operationId: createMixcutDraft, responses: { '200': { description: ok } } }

  /mixcut/drafts/{draftId}:
    parameters:
      - { in: path, name: draftId, required: true, schema: { type: string } }
    get:    { tags: [mixcut], operationId: getMixcutDraft,    responses: { '200': { description: ok } } }
    put:    { tags: [mixcut], operationId: upsertMixcutDraft, responses: { '200': { description: ok } } }
    delete: { tags: [mixcut], operationId: deleteMixcutDraft, responses: { '200': { description: ok } } }

  # 从实例生成任务。缺素材 → 409 MISSING_ASSETS（同 rerun，error.details.missing_assets[]）。
  # body 可空；仅 output_variants / perturbation_profile 可覆盖。
  /mixcut/drafts/{draftId}/generate:
    parameters:
      - { in: path, name: draftId, required: true, schema: { type: string } }
    post: { tags: [mixcut], operationId: generateMixcutJobFromDraft, responses: { '200': { description: ok } } }

  # v0.16+: pic-gen 文字转图预览（独立 Node 服务由 aep.picgen.base-url 指向）
  /mixcut/picgen/preview:
    post:
      tags: [mixcut]
      operationId: previewMixcutPicgen
      responses: { '200': { description: ok } }

  # v0.15+: 混剪 → 发布 桥接
  # v0.20+: 顶层 schedule: ScheduleSpec 决定每条 output 的 scheduledAt。
  #   strategy=immediate          所有派单 now 起飞
  #   strategy=single             所有派单同一时刻起飞（兼容 v0.15 行为）
  #   strategy=daily_recurring    按 start_date / time_slots / timezone 把 outputs 错峰铺开
  #                               可选 max_days（容量上限）、jitter_minutes (0..30) 抖动
  # TargetItem.scheduled_at 字段移除（时间由 schedule 决定）。
  # outputs[] 顺序即铺开顺序（i → 第 ⌊i/K⌋ 天的第 i%K 槽）。
  /me/mixcut/publish-batch:
    post:
      tags: [mixcut]
      operationId: publishMixcutBatch
      description: 一次性将多个混剪变体（必须有 cdn_url）派单到多个社交账号；schedule 字段决定 cadence。
      responses: { '200': { description: ok } }

  # ───────────────────────────────────────────────────────────────────────────
  # ────────────────────────────────────────────────────────────
  # 数字人资产平台（apps/web-aiavatar，v0.51 dap 领域：com.aistareco.aep.dap.*，表 dap_*）
  # REST 真源 = apps/web-aiavatar/src/proto/api.ts；全部 authenticated（Bearer JWT）。
  # 注意：实际挂载于 /api/v1/**；本文件按惯例省略 /api 前缀。
  /v1/avatars:
    get:  { tags: [dap], operationId: dapListAvatars, description: scope=mine|public + path/status/fav/q 过滤, responses: { '200': { description: ok } } }
    post: { tags: [dap], operationId: dapCreateAvatar, responses: { '200': { description: ok } } }
  /v1/avatars/{id}:
    get:    { tags: [dap], operationId: dapGetAvatar, responses: { '200': { description: ok } } }
    patch:  { tags: [dap], operationId: dapPatchAvatar, responses: { '200': { description: ok } } }
    delete: { tags: [dap], operationId: dapDeleteAvatar, description: 软删 → 回收站（默认 30 天后自动物理清理）, responses: { '200': { description: ok } } }
  /v1/avatars/trash:
    get: { tags: [dap], operationId: dapListTrash, description: 回收站列表（含 purgeAt / daysLeft）, responses: { '200': { description: ok } } }
  /v1/avatars/{id}/restore:
    post: { tags: [dap], operationId: dapRestoreAvatar, description: 从回收站恢复, responses: { '200': { description: ok } } }
  /v1/avatars/{id}/purge:
    delete: { tags: [dap], operationId: dapPurgeAvatar, description: 立即彻底删除（仅回收站内资产；删行+文件）, responses: { '200': { description: ok } } }
  /v1/avatars/{id}/references:
    get: { tags: [dap], operationId: dapAvatarReferences, summary: 'v0.61 反向「应用于」：数字人被本人哪些 music/drama 艺人壳引用（AvatarReferenceDto[]：ipId/ipName/app/type/status/dapDisplayRef/importedAt）', responses: { '200': { description: ok } } }
  /v1/avatars/{id}/versions:
    get: { tags: [dap], operationId: dapAvatarVersions, responses: { '200': { description: ok } } }
  /v1/avatars/{id}/versions/{version}/switch:
    parameters: [ { in: path, name: id, required: true, schema: { type: string } }, { in: path, name: version, required: true, schema: { type: integer } } ]
    post: { tags: [dap], operationId: dapSwitchAvatarVersion, summary: '切换到指定版本', responses: { '200': { description: ok } } }
  /v1/avatars/{id}/versions/{version}/fork:
    parameters: [ { in: path, name: id, required: true, schema: { type: string } }, { in: path, name: version, required: true, schema: { type: integer } } ]
    post: { tags: [dap], operationId: dapForkAvatarVersion, summary: '从指定版本派生新版本', responses: { '200': { description: ok } } }
  /v1/avatars/{id}/save-as:
    post: { tags: [dap], operationId: dapSaveAsFromPublic, summary: '数字人广场「另存为我的数字人」：复制只读公开数字人(PA-*)为可编辑数字人', responses: { '200': { description: ok } } }
  /v1/admin/avatars:
    get:  { tags: [dap], operationId: dapAdminListPublicAvatars, summary: '数字人广场 · 运营公开数字人列表（OPERATOR/SUPER_ADMIN）', responses: { '200': { description: ok } } }
    post: { tags: [dap], operationId: dapAdminCreatePublicAvatar, summary: '数字人广场 · 运营新增公开数字人', responses: { '200': { description: ok } } }
  /v1/admin/avatars/{id}:
    put:    { tags: [dap], operationId: dapAdminUpdatePublicAvatar, summary: '数字人广场 · 运营编辑公开数字人', responses: { '200': { description: ok } } }
    delete: { tags: [dap], operationId: dapAdminDeletePublicAvatar, summary: '数字人广场 · 运营下架公开数字人', responses: { '200': { description: ok } } }
  /v1/admin/uploads:
    post: { tags: [dap], operationId: dapAdminUploadImage, summary: '数字人广场 · 运营上传形象图(multipart) → { key, url }', responses: { '200': { description: ok } } }
  /v1/avatars/{id}/looks:
    get:  { tags: [dap], operationId: dapAvatarLooks, responses: { '200': { description: ok } } }
    post: { tags: [dap], operationId: dapCreateLook, description: 描述造型或 sceneId 场景替换 → 异步任务, responses: { '200': { description: ok } } }
  /v1/avatars/{id}/derivatives:
    get:  { tags: [dap], operationId: dapAvatarDerivatives, responses: { '200': { description: ok } } }
    post: { tags: [dap], operationId: dapCreateDerivative, description: 'type=atlas|expr|scene|ward|d3|video → 异步任务；options{items[{label,prompt}]≤6 / extraPrompt / motion} + templateId(atlas) 自定义配方（v0.52）', responses: { '200': { description: ok } } }
  /v1/avatars/{id}/describe:
    post: { tags: [dap], operationId: dapDescribeAvatar, description: 落人设描述与表单（同步）, responses: { '200': { description: ok } } }
  /v1/avatars/{id}/photos:
    post: { tags: [dap], operationId: dapUploadPhotos, description: 'multipart files[] 照片素材', responses: { '200': { description: ok } } }
  /v1/avatars/{id}/generate:
    post: { tags: [dap], operationId: dapGenerateAvatar, description: 'mode=describe(4 变体)|upload(高保真复刻) → 异步任务；真人路径必须选择或自动解析一条 approved 素材，任务 payload 使用 qasset:// 引用', responses: { '200': { description: ok }, '403': { description: DAP_MATERIAL_APPROVAL_REQUIRED } } }
  /v1/avatars/{id}/pick:
    post: { tags: [dap], operationId: dapPickVariant, responses: { '200': { description: ok } } }
  /v1/avatars/{id}/iterate:
    post: { tags: [dap], operationId: dapIterateAvatar, description: 自然语言迭代 → 异步任务, responses: { '200': { description: ok } } }
  /v1/avatars/{id}/warp:
    post: { tags: [dap], operationId: dapWarpAvatar, description: 几何精调参数 → 异步任务（AI 重绘路径，legacy；v0.52 起精确滑杆走端上 refine-apply）, responses: { '200': { description: ok } } }
  /v1/avatars/{id}/image:
    get: { tags: [dap], operationId: dapAvatarImage, description: 当前定妆图同源流式输出（owner 校验；供端上精调画布取图，规避 CDN 跨域 canvas 污染）, responses: { '200': { description: image bytes } } }
  /v1/avatars/{id}/refine-apply:
    post: { tags: [dap], operationId: dapRefineApply, description: 端上精调成品回传（multipart file+params+note）→ 存储/切定妆图/记 refine 版本/登记已完成作业；零积分, responses: { '200': { description: ok } } }
  /v1/avatars/{id}/finalize:
    post: { tags: [dap], operationId: dapFinalizeAvatar, description: 定稿（archive=true 直接入库）, responses: { '200': { description: ok } } }
  /v1/avatars/{id}/voice:
    post: { tags: [dap], operationId: dapBindVoice, responses: { '200': { description: ok } } }
  /v1/captures:
    post: { tags: [dap], operationId: dapCreateCapture, responses: { '200': { description: ok } } }
  /v1/captures/{id}/footage:
    post: { tags: [dap], operationId: dapUploadFootage, description: multipart file 动作素材（视频/图片，抽关键帧）, responses: { '200': { description: ok } } }
  /v1/captures/{id}/verify:
    post:
      tags: [dap]
      operationId: dapVerifyCapture
      description: >-
        本人刷脸核验 + 自动登记授权。前置条件：该次捕获必须同时绑定当前平台协议确认快照，且七牛真人组为 active。
        通过后标 verified，并把 consentId / 协议版本与摘要 / 七牛 qgroupid / 核验时间写入 LIC 证据链；
        随后 best-effort 把捕获素材送审（送审失败只告警，不回滚授权证据）。
      responses:
        '200': { description: 'ok（passed / captureId / authSessionId / licenseId）' }
        '400': { description: 'DAP_NO_FOOTAGE 未上传素材' }
        '409': { description: 'DAP_AUTH_NOT_COMPLETED 尚未完成刷脸认证' }
        '503': { description: 'DAP_MODELINK_NOT_CONFIGURED 未配置素材合规服务（会话阶段即报错）' }

  # ── 真人授权确认 + 本人刷脸 + 素材送审（v0.106；七牛 modelink）──
  # 接入点由 admin「AI 应用绑定」的用途 DAP_REAL_AVATAR 提供；未配置且不允许 mock → 503（§8.0，不产假授权）。
  /v1/real-auth/agreement:
    get:
      tags: [dap]
      operationId: dapGetRealAuthAgreement
      summary: '读取当前真人数字形象授权说明（需登录）'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/DapRealAuthAgreement' }
  /v1/real-auth/sessions:
    post:
      tags: [dap]
      operationId: dapStartRealAuthSession
      summary: '确认当前协议并开启本人刷脸会话；同一次捕获幂等，同一真人的后续素材复用 active qgroupid'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [captureId, agreementAccepted, agreementVersion]
              properties:
                captureId: { type: string }
                agreementAccepted: { type: boolean, enum: [true] }
                agreementVersion: { type: string }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/DapRealAuthSession' }
        '400': { description: 'DAP_NO_FOOTAGE / DAP_CAPTURE_REQUIRED / DAP_CONSENT_REQUIRED / DAP_CONSENT_VERSION_CHANGED' }
        '503': { description: 'DAP_MODELINK_NOT_CONFIGURED 未绑定 modelink 端点且不允许 mock（不落会话行）' }
  /v1/real-auth/sessions/{id}:
    get:
      tags: [dap]
      operationId: dapGetRealAuthSession
      summary: '查询认证会话（非终态时向上游刷新；awaiting_auth 带出 h5Url，约 120s 有效）'
      parameters: [ { in: path, name: id, required: true, schema: { type: string } } ]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/DapRealAuthSession' }
        '404': { description: 'DAP_AUTH_SESSION_NOT_FOUND' }
  /v1/real-auth/sessions/{id}/restart:
    post:
      tags: [dap]
      operationId: dapRestartRealAuthSession
      summary: '短时 h5_link 过期后删除失败组并重建本人刷脸会话；沿用原协议确认快照'
      parameters: [ { in: path, name: id, required: true, schema: { type: string } } ]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { $ref: '#/components/schemas/DapRealAuthSession' }
        '404': { description: 'DAP_AUTH_SESSION_NOT_FOUND' }
  /v1/real-auth/callback:
    get:
      tags: [dap]
      operationId: dapRealAuthCallback
      summary: '刷脸完成后的浏览器回跳落地页（公开端点，无 JWT）'
      description: >-
        上游刷脸完成后浏览器直接跳转到此地址，故无法带 JWT —— 防伪靠 query 里不可枚举的 state
        （= 会话 callbackToken）+ 服务端 validateCalledAt 幂等闸（byted_token 一次性）。
        本端点只把结果回传上游（202 受理），**不判定授权生效**；生效与否一律以服务端轮询 GET 分组为准。
        返回移动端 text/html 落地页，并自动跳回同源 #/real-auth/{sessionId} 可恢复路由；按钮作为手动兜底。
      security: []
      parameters:
        - { in: query, name: state, required: true, schema: { type: string }, description: '会话 callbackToken' }
        - { in: query, name: resultCode, required: false, schema: { type: string }, description: '"10000" = 刷脸成功' }
        - { in: query, name: bytedToken, required: false, schema: { type: string } }
      responses:
        '200': { description: 'HTML 落地页', content: { text/html: { schema: { type: string } } } }
  /v1/materials:
    get:
      tags: [dap]
      operationId: dapListMaterials
      summary: '按引用查送审素材；refType=subject 时汇总某真人资产的全部素材'
      parameters:
        - { in: query, name: refType, required: true, schema: { type: string, enum: [avatar, capture, subject] } }
        - { in: query, name: refId, required: true, schema: { type: string } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { type: array, items: { $ref: '#/components/schemas/DapMaterial' } }
    post:
      tags: [dap]
      operationId: dapSubmitMaterial
      summary: '送审：refType=avatar 定妆图（走平台 aigc 默认组）/ refType=capture 重交该次捕获素材'
      description: >-
        幂等：同 ref + 同源文件已有非 failed 记录 → 原样返回；failed 后可重交。
        refType=capture 仍要求该次捕获有 active 的刷脸认证会话（正常路径由 verify 自动送审）。
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [refType, refId]
              properties:
                refType: { type: string, enum: [avatar, capture] }
                refId: { type: string }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data: { type: array, items: { $ref: '#/components/schemas/DapMaterial' } }
        '400': { description: 'DAP_NO_IMAGE / DAP_MATERIAL_BAD_REF / DAP_MATERIAL_REF_REQUIRED' }
        '409': { description: 'DAP_AUTH_NOT_COMPLETED（capture 重交时认证未完成）' }
        '503': { description: 'DAP_MODELINK_NOT_CONFIGURED' }
  /v1/licenses:
    get:  { tags: [dap], operationId: dapListLicenses, responses: { '200': { description: ok } } }
    post: { tags: [dap], operationId: dapCreateLicense, description: '声明式登记仅保留给非真人对象；带 avatarId 返回 DAP_REAL_AUTH_REQUIRED，真人授权必须走协议确认 + 七牛本人刷脸链路', responses: { '200': { description: ok }, '400': { description: DAP_REAL_AUTH_REQUIRED } } }
  /v1/licenses/{id}:
    get: { tags: [dap], operationId: dapGetLicense, responses: { '200': { description: ok } } }
  /v1/licenses/{id}/certificate:
    get: { tags: [dap], operationId: dapLicenseCertificate, description: '生成/获取移动端 HTML 授权确认凭证；v2 同时展示平台协议快照与七牛 qgroupid 核验引用', responses: { '200': { description: ok } } }
  /v1/licenses/{id}/renew:
    post: { tags: [dap], operationId: dapRenewLicense, responses: { '200': { description: ok } } }
  /v1/licenses/{id}/supplement:
    post:
      tags: [dap]
      operationId: dapSupplementLicense
      description: '历史 liveness 授权缺当前平台协议快照时补确认；复用已有 active 七牛技术证据，不重复刷脸。技术证据不可用则 409 要求重新本人确认。'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agreementAccepted, agreementVersion]
              properties:
                agreementAccepted: { type: boolean, enum: [true] }
                agreementVersion: { type: string }
      responses:
        '200': { description: ok }
        '400': { description: 'DAP_CONSENT_REQUIRED / DAP_CONSENT_VERSION_CHANGED / DAP_SUPPLEMENT_NOT_APPLICABLE' }
        '409': { description: DAP_LIVENESS_REAUTH_REQUIRED }
  /v1/voices/builtin:
    get: { tags: [dap], operationId: dapBuiltinVoices, description: 内置 AI 合成音色 7 款, responses: { '200': { description: ok } } }
