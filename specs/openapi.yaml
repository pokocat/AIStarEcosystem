  # ── 3.9 Marketplace ──────────────────────

  /marketplace:
    get:
      tags: [marketplace]
      operationId: listMarketplace
      security: []
      parameters:
        - name: style
          in: query
          schema: { type: string }
        - name: sort
          in: query
          schema:
            type: string
            enum: [priceAsc, priceDesc, newest, popular]
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: 市场艺人列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/MarketplaceArtist' }
                      pagination: { $ref: '#/components/schemas/PaginationMeta' }
