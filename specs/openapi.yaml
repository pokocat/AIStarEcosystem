        category: { type: string }
        thumb:    { type: string }
        videoUrl: { type: string, nullable: true }

    CelebrityStar:
      type: object
      required: [id, name, avatar, cover, category, isHot, description,
                 startingPrice, authorization, stats, sampleVideos, pricing]
      properties:
        id:             { type: string }
