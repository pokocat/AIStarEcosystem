  # ── AI 应用绑定（v0.41 新增；用途 → 端点，一用途一端点，无兜底） ──────────
  /admin/ai-app-bindings:
    get: { tags: [admin-ai-models], operationId: adminListAiAppBindings, responses: { '200': { description: 全部用途（含未绑定）及其绑定端点 } } }
  /admin/ai-app-bindings/{purpose}:
    parameters: [{ name: purpose, in: path, required: true, schema: { type: string }, description: 'AiModelPurpose（如 SCRIPT_DRAFT / SELLING_POINTS / VARIABLE_EXTRACT）' }]
    put:    { tags: [admin-ai-models], operationId: adminBindAiApp,   responses: { '200': { description: '把用途绑定到一个启用端点（默认端点，body: { endpointId }）；同时幂等纳入候选池（D-11）' } } }
    delete: { tags: [admin-ai-models], operationId: adminUnbindAiApp, responses: { '204': { description: 解绑该用途 } } }
  # ── D-11：一用途多候选端点 + capability 元数据（AiAppBinding 仍是默认端点） ──────────
  /admin/ai-app-bindings/{purpose}/candidates:
    parameters: [{ name: purpose, in: path, required: true, schema: { type: string }, description: 'AiModelPurpose' }]
    get:  { tags: [admin-ai-models], operationId: adminListAiAppCandidates, responses: { '200': { description: '该用途全部候选端点（含 capability + 默认标记）' } } }
    post: { tags: [admin-ai-models], operationId: adminAddAiAppCandidate,   responses: { '200': { description: '新增候选（body: { endpointId, sortOrder?, enabled?, maxRefImages?, supportsFirstLastFrame?, supportsSubjectReference?, maxDurationSec?, creditCostOverride? }）' } } }
  /admin/ai-app-bindings/{purpose}/candidates/{endpointId}:
    parameters:
      - { name: purpose, in: path, required: true, schema: { type: string }, description: 'AiModelPurpose' }
      - { name: endpointId, in: path, required: true, schema: { type: string } }
    put:    { tags: [admin-ai-models], operationId: adminUpdateAiAppCandidate, responses: { '200': { description: '更新候选 capability / 单价 override / 启用 / 排序' } } }
    delete: { tags: [admin-ai-models], operationId: adminRemoveAiAppCandidate, responses: { '204': { description: '删除候选端点（默认端点不允许删）' } } }

