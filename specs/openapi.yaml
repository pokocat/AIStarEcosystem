      responses:
        '201':
          description: 挂牌成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/MarketplaceArtist' }
        '409':
          description: 艺人已在市场挂牌
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /marketplace/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
