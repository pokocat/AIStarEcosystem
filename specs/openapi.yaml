  /wardrobe/outfits/{id}:
    delete:
      tags: [wardrobe]
      operationId: deleteOutfit
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 删除成功

