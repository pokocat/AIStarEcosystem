      responses: { '200': { description: 'ok（PageEnvelope<AepUser>）' } }
    post: { tags: [admin-users], operationId: adminCreateUser, responses: { '201': { description: created } } }
  /admin/users/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
    get:    { tags: [admin-users], operationId: adminGetUser,    responses: { '200': { description: ok } } }
    put:    { tags: [admin-users], operationId: adminUpdateUser, responses: { '200': { description: ok } } }
    patch:  { tags: [admin-users], operationId: adminPatchUser,  responses: { '200': { description: ok } } }
