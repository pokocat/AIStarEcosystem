          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Wallet' }

  /me/wallet/credits:
    get:
      tags: [finance]
      operationId: getMyWalletCredits
      summary: 获取当前用户积分（与 /me/wallet 同 shape，语义别名）
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Wallet' }

  /me/wallet/packages:
    get:
      tags: [finance]
      operationId: listMyWalletPackages
      summary: 充值套餐列表（运营在 admin 后台配置 / 上下架）。v2 §6：?sourceApp 过滤「通用 + 该子应用专属」。
      parameters:
        - name: sourceApp
          in: query
          required: false
          schema: { type: string, enum: [music, drama, celebrity, aiavatar, star] }
          description: 子应用 id；只返回 appScope=all 或 =sourceApp 的套餐
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
