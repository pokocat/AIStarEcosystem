  /poses/{id}/unlock:
    post:
      tags: [poses]
      operationId: unlockPose
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: 解锁成功
        '402':
          description: 积分不足
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

