# 军师「快出片」专用预发实例：H2 单机持久化，但不启用 dev/test 演示数据或 H2 Console。
# 服务只监听 127.0.0.1，军师 BFF 通过独立 service token 回源。
spring:
  datasource:
    url: jdbc:h2:file:./data/aistareco;MODE=MySQL;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: false

aep:
  dev-auth:
    enabled: false
  seed:
    dev-data:
      enabled: false
  dev-fake-llm:
    enabled: false
