spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: SET TIME ZONE 'UTC'
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.auto_quote_keyword: true
  flyway:
    enabled: true
    locations: classpath:db/postgresql
    baseline-on-migrate: false
