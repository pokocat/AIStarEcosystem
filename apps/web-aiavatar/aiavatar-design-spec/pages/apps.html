<!DOCTYPE html>
<html lang="zh-CN" class="light anim">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AiAvatar &middot; 应用中心</title>
    <style id="theme-vars">
/* ============================================================
   AiAvatar 数字人资产平台 · 设计稿品牌样式
   从源项目 DESIGN.md + globals.css 提取的完整设计令牌
   ============================================================ */

:root {
  /* ——— 纸面 / 表面 ——— */
  --canvas:     #F7F9FB;
  --canvas-2:   #EEF2F6;
  --surface:    #FFFFFF;
  --surface-2:  #F6F8FB;
  --surface-3:  #EDF1F5;

  /* ——— 文字（深蓝灰墨） ——— */
  --ink:    #14202B;
  --ink-2:  #5A6873;
  --ink-3:  #8A96A1;
  --ink-4:  #BAC4CD;

  /* ——— 线（冷灰） ——— */
  --line:   #EBEFF3;
  --line-2: #E0E6EC;
  --line-3: #CFD7DF;

  /* ——— 主色：Studio Cyan ——— */
  --primary:      #12B3DE;
  --primary-700:  #0C97BE;
  --primary-600:  #10A6CF;
  --primary-500:  #4CCBEC;
  --primary-soft: #E6F5FA;
  --primary-tint: #F3FAFD;
  --on-primary:   #FFFFFF;
  --grad:         linear-gradient(150deg, #2BC2E8, #12B3DE 60%, #0E9CC4);

  /* ——— 语义（柔和） ——— */
  --ok:      #1AA06E;  --ok-s:   #E2F4EC;
  --warn:    #D9920E;  --warn-s: #FBF0DA;
  --err:     #E0455C;  --err-s:  #FBE6EA;
  --info:    #2BA6E8;  --info-s: #E6F2FB;

  /* ——— 次要调色板（身份 / 导航） ——— */
  --app-music:     #7C5CE6;
  --app-commerce:  #E8884A;
  --app-drama:     #3E63C8;
  --path-ai:       #8F6BFF;
  --store-video:   #1AA06E;
  --store-3d:      #D9920E;
  --store-voice:   #8A6BFF;

  /* ——— 阴影（冷蓝调柔和扩散） ——— */
  --sh-1:  0 1px 2px rgba(20,36,55,.035), 0 1px 3px rgba(20,36,55,.04);
  --sh-2:  0 2px 6px rgba(20,36,55,.04),  0 8px 20px rgba(20,36,55,.055);
  --sh-3:  0 8px 24px rgba(20,36,55,.07),  0 24px 50px rgba(20,36,55,.09);
  --ring:  0 0 0 3px rgba(18,179,222,.16);

  /* ——— 圆角 ——— */
  --r-xs: 7px; --r-sm: 9px; --r-md: 12px; --r-lg: 15px;
  --r-xl: 19px; --r-2xl: 24px; --r-pill: 999px;

  /* ——— 字体 ——— */
  --font-disp:  'Manrope', 'Noto Sans SC', system-ui, -apple-system, sans-serif;
  --font-ui:    'Manrope', 'Noto Sans SC', system-ui, sans-serif;
  --font-serif: 'Newsreader', 'Songti SC', 'Noto Serif SC', Georgia, serif;
  --font-mono:  'JetBrains Mono', ui-monospace, monospace;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  font-family: var(--font-ui);
  background: var(--canvas);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
::selection { background: rgba(18,179,222,.16); }

h1, h2, h3, h4 { font-family: var(--font-disp); font-weight: 700; letter-spacing: -.02em; margin: 0; }

::-webkit-scrollbar { width: 0; height: 0; }

/* ============================================================
   动画
   ============================================================ */
@keyframes fadeUp  { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes fadeIn  { from { opacity: 0; } to { opacity: 1; } }
@keyframes pulse   { 0%,100% { opacity: 1; } 50% { opacity: .4; } }
@keyframes spin    { to { transform: rotate(360deg); } }
@keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }

html.anim .fade-up  { animation: fadeUp .5s cubic-bezier(.22,1,.36,1) both; }
html.anim .fade-in  { animation: fadeIn .4s ease both; }
html.anim .stagger > * { animation: fadeUp .5s cubic-bezier(.22,1,.36,1) both; }
html.anim .stagger > *:nth-child(1) { animation-delay: .02s }
html.anim .stagger > *:nth-child(2) { animation-delay: .06s }
html.anim .stagger > *:nth-child(3) { animation-delay: .10s }
html.anim .stagger > *:nth-child(4) { animation-delay: .14s }
html.anim .stagger > *:nth-child(5) { animation-delay: .18s }
html.anim .stagger > *:nth-child(6) { animation-delay: .22s }

.mono { font-family: var(--font-mono); }
button { font-family: inherit; }
input, textarea, select { font-family: inherit; }

/* ============================================================
   Registry Dossier 原语
   ============================================================ */
.asset-name { font-family: var(--font-serif); font-weight: 500; letter-spacing: -.005em; }
.asset-name-lg { font-family: var(--font-serif); font-weight: 500; letter-spacing: -.01em; line-height: 1.04; }
.reg-no {
  font-family: var(--font-mono); font-size: 11px; font-weight: 500; letter-spacing: .04em;
  color: var(--ink-3); display: inline-flex; align-items: center; gap: 6px;
}
.reg-no::before {
  content: 'REG'; font-size: 8.5px; font-weight: 600; letter-spacing: .12em;
  color: var(--primary); background: var(--primary-soft); padding: 2px 5px; border-radius: 4px;
}
.field-label {
  font-family: var(--font-mono); font-size: 10px; font-weight: 500; letter-spacing: .1em;
  text-transform: uppercase; color: var(--ink-4);
}
.seal {
  position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  font-family: var(--font-mono); font-size: 10.5px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase;
  color: var(--ok); border: 1.5px solid var(--ok); border-radius: var(--r-pill); padding: 5px 13px;
  opacity: .9; transform: rotate(-4deg);
}
.corner-tick { width: 9px; height: 9px; border-top: 1.5px solid var(--line-3); border-left: 1.5px solid var(--line-3); }

@keyframes sealIn { from { opacity: 0; transform: rotate(-4deg) scale(1.3); } to { opacity: .9; transform: rotate(-4deg) scale(1); } }
html.anim .seal { animation: sealIn .5s cubic-bezier(.34,1.56,.64,1) both .2s; }

/* ============================================================
   移动端应用壳（设计稿展示用 · 固定宽度 375px 居中）
   ============================================================ */
.app-root {
  position: relative; width: 375px; min-height: 812px; margin: 0 auto;
  display: flex; flex-direction: column; background: var(--canvas);
  overflow: hidden; box-shadow: 0 0 0 1px var(--line), 0 18px 50px rgba(20,36,55,.12);
  border-radius: 32px;
}
.m-content { flex: 1; position: relative; min-height: 0; }

/* 顶部导航 */
.wx-nav {
  position: relative; z-index: 30; flex: 0 0 48px; height: 48px;
  display: flex; align-items: center; gap: 8px; padding: 0 12px;
}
.wx-nav .nav-title {
  flex: 1; text-align: center; font-family: var(--font-disp); font-weight: 700;
  font-size: 16.5px; letter-spacing: -.01em; color: var(--ink);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.wx-nav .nav-back {
  width: 34px; height: 34px; flex: 0 0 34px; border: none; background: none; cursor: pointer;
  display: grid; place-items: center; color: var(--ink); margin-left: -4px;
}
.wx-nav .nav-spacer { width: 34px; flex: 0 0 34px; }

/* 内容区 */
.m-body {
  flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; position: relative;
  -webkit-overflow-scrolling: touch;
}
.m-body.has-tabbar { padding-bottom: 66px; }
.m-body::-webkit-scrollbar { width: 0; height: 0; }

/* 底部 Tab 栏 */
.wx-tabbar {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 45; height: 58px;
  background: rgba(255,255,255,.86); backdrop-filter: blur(18px) saturate(160%);
  border-top: 1px solid var(--line); display: flex; align-items: flex-start;
  border-radius: 0 0 32px 32px;
}
.wx-tab {
  flex: 1; height: 58px; border: none; background: none; cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  color: var(--ink-3); transition: color .15s;
}
.wx-tab .lbl { font-size: 10.5px; font-weight: 600; letter-spacing: .01em; }
.wx-tab.on { color: var(--primary); }
.wx-tab.on .lbl { font-weight: 700; }

/* 中间凸起创建键 */
.wx-fab-slot { flex: 1; position: relative; display: flex; justify-content: center; }
.wx-fab {
  position: absolute; top: -20px; width: 56px; height: 56px; border-radius: 20px;
  border: 1px solid rgba(255,255,255,.78); cursor: pointer;
  background: transparent; color: #fff; display: grid; place-items: center; isolation: isolate;
  box-shadow: 0 12px 26px rgba(18,179,222,.24), 0 5px 12px rgba(76,92,125,.10);
  transition: transform .18s cubic-bezier(.34,1.56,.64,1);
}
.wx-fab .fab-visual {
  position: absolute; inset: 0; border-radius: inherit; overflow: hidden; z-index: 0;
  background: var(--grad);
}
.wx-fab .fab-veil {
  position: absolute; inset: 0;
  background: radial-gradient(circle at 34% 26%, rgba(255,255,255,.34), transparent 46%),
    linear-gradient(145deg, rgba(255,255,255,.18), transparent 44%, rgba(10,60,84,.30) 100%);
  box-shadow: 0 1px 0 rgba(255,255,255,.5) inset;
}
.wx-fab svg { position: relative; z-index: 1; filter: drop-shadow(0 2px 5px rgba(16,45,70,.30)); }
.wx-fab .fab-lbl {
  position: absolute; bottom: -19px; z-index: 2; font-size: 10.5px; font-weight: 700;
  color: var(--primary); white-space: nowrap; text-shadow: 0 1px 0 rgba(255,255,255,.88);
}

/* 卡片 */
.m-card {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r-lg); box-shadow: var(--sh-1);
}
.m-press:active { transform: scale(.985); }
.m-tap { transition: transform .12s, background .15s; }
.m-tap:active { transform: scale(.97); }
.m-clip1 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.m-clip2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.m-hscroll {
  display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x proximity;
  -webkit-overflow-scrolling: touch;
}
.m-hscroll::-webkit-scrollbar { height: 0; }
.m-hscroll > * { scroll-snap-align: start; }

/* 骨架屏 */
.m-skel {
  position: relative; overflow: hidden; background: var(--surface-3);
  background-image: linear-gradient(100deg, transparent 20%, rgba(255,255,255,.72) 50%, transparent 80%);
  background-size: 200% 100%; animation: shimmer 1.3s ease-in-out infinite;
}

/* 遮罩层 */
.m-overlay {
  position: absolute; inset: 0; z-index: 80; background: var(--canvas);
  display: flex; flex-direction: column;
}
.m-sheet-backdrop {
  position: absolute; inset: 0; z-index: 85;
  background: rgba(20,40,60,.4); backdrop-filter: blur(2px);
  animation: mSheetFade .2s ease both;
}
@keyframes mSheetFade { from { opacity: .2; } to { opacity: 1; } }
.m-sheet {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 86;
  background: var(--surface); border-radius: 24px 24px 0 0;
  box-shadow: var(--sh-3); padding-bottom: 20px;
}
.m-sheet-grip { width: 38px; height: 4px; border-radius: 99px; background: var(--line-3); margin: 9px auto 4px; }

/* 段落排版 */
.m-body p { text-wrap: pretty; }

    </style>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.1/dist/index.global.js"></script>
    <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
    <style type="text/tailwindcss">
  @theme inline {
    --color-primary: var(--on-primary);
  }
  @layer base {
    body { background: var(--on-background); color: var(--on-foreground); }
    td, th { @apply break-words; word-break: break-all; word-break: auto-phrase; }
    th { @apply whitespace-nowrap; }
  }
    </style>
    <style>
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      [data-icon] {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        -webkit-mask-size: contain;
        mask-size: contain;
        -webkit-mask-repeat: no-repeat;
        mask-repeat: no-repeat;
        -webkit-mask-position: center;
        mask-position: center;
        background-color: currentColor;
      }
    </style>
</head>
<body>

<div class="app-root">
  <div class="m-content">

    <!-- Top Nav -->
    <div class="wx-nav">
      <div class="nav-spacer"></div>
      <div class="nav-title">应用中心</div>
      <div class="nav-spacer"></div>
    </div>

    <!-- Body -->
    <div class="m-body has-tabbar">

      <!-- App Cards -->
      <div class="cards-stack">

              AI 唱歌
            </span>
            <span class="pill">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#7C5CE6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2" ry="2"/></svg>
              MV 制作
            </span>
            <span class="pill">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#7C5CE6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7z"/><circle cx="12" cy="9" r="2.5"/></svg>

          </div>

        <!-- Card 2: AI 短视频带货 -->

              </svg>
            </div>
            <div class="card-badge">邀约开通</div>
          </div>
          <div class="card-title-row">
            <span class="card-title">AI 短视频带货</span>
            <svg class="card-link-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M7 17L17 7"/><path d="M7 7h10v10"/>
            </svg>
          </div>
          <p class="card-desc">一键生成带货视频，数字人主播全天候直播。</p>
          <div class="card-pills">
            <span class="pill">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#E8884A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>

        <span class="lbl">数字人</span>

      <!-- Center FAB -->

        <button class="wx-fab">

          </svg>

      <!-- 应用 (active) -->
