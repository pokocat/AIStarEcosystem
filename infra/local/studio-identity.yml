# Studio 本机开发专用；由 studio-local-identity.py 启动，禁止用于生产。
server:
  address: 127.0.0.1
  port: 8098
spring:
  datasource:
    url: ${STUDIO_LOCAL_ID_DATABASE}
id:
  issuer: http://localhost:8098
  cors:
    allowed-origins:
      - http://localhost:3013
      - http://127.0.0.1:3013
      - http://localhost:3016
      - http://127.0.0.1:3016
      - http://localhost:3019
      - http://127.0.0.1:3019
  clients:
    - client-id: web-aiavatar-local
      display-name: AI IP 画布（本地）
      product-code: aistar
      audience: aistar-api
      grants:
        - authorization_code
        - refresh_token
      redirect-uris:
        - http://localhost:3013/auth/callback
        - http://127.0.0.1:3013/auth/callback
        - http://localhost:3016/auth/callback
        - http://127.0.0.1:3016/auth/callback
        - http://localhost:3019/auth/callback
        - http://127.0.0.1:3019/auth/callback
      post-logout-redirect-uris:
        - http://localhost:3013/
        - http://127.0.0.1:3013/
        - http://localhost:3016/
        - http://127.0.0.1:3016/
        - http://localhost:3019/
        - http://127.0.0.1:3019/
      scopes:
        - openid
        - profile
        - phone
        - offline_access
    - client-id: admin-server
      client-secret: ${STUDIO_LOCAL_FIXTURE_SECRET}
      display-name: Studio 本地测试账号初始化
      product-code: admin
      audience: admin-api
      grants:
        - client_credentials
      scopes:
        - product.link
        - admin.users
