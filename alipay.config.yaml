# ========================================
# 支付宝支付集成配置文件
# 时间: 2026-07-10
# 应用: AIStarEcoSystem
# ========================================

alipay:
  # 基本信息
  app-id: "2021006169613183"
  app-name: "AIStarEcoSystem"
  merchant-account: "**成 pok***@163.com"

  # 密钥配置 (RSA2)
  # 注意: 应用私钥请从支付宝开发者平台获取，妥善保管！
  app-private-key: "${ALIPAY_APP_PRIVATE_KEY}"  # 从环境变量读取
  alipay-public-key: "${ALIPAY_PUBLIC_KEY}"      # 从环境变量读取

  # 网关配置
  gateway-url: "https://openapi.alipay.com/gateway.do"

  # 回调配置
  notify-url: "https://api.aibuzz.cn/api/alipay/notify"
  return-url: "https://aibuzz.cn/payment/return"  # 用户返回商户网站的地址

  # 加签方式
  sign-type: "RSA2"
  charset: "UTF-8"
  format: "JSON"

  # 沙箱配置（测试时使用）
  sandbox:
    enabled: false
    gateway-url: "https://openapi-sandbox.dl.alipaydev.com/gateway.do"
    app-id: "2021006169613183"  # 沙箱应用ID需单独申请

  # 支付场景配置
  trade:
    # 统一收单交易支付接口 - 电脑支付
    page-pay:
      return-url: "https://aibuzz.cn/payment/return"
      notify-url: "https://api.aibuzz.cn/api/alipay/notify"
      timeout-express: "30m"  # 订单超时时间
      product-code: "FAST_INSTANT_TRADE_PAY"

    # 统一收单交易支付接口 - 手机支付
    wap-pay:
      return-url: "https://aibuzz.cn/payment/return?mobile=true"
      notify-url: "https://api.aibuzz.cn/api/alipay/notify"
      timeout-express: "30m"
      product-code: "QUICK_WAP_PAY"

    # APP支付
    app-pay:
      notify-url: "https://api.aibuzz.cn/api/alipay/notify"
      timeout-express: "30m"
      product-code: "QUICK_MSECURITY_PAY"

  # 验签配置
  verify-sign: true

  # 日志配置
  log:
    enabled: true
    level: "INFO"
    path: "./logs/alipay"

# ========================================
# 环境变量说明
# ========================================
# 需要在系统环境变量或 .env 文件中配置:
#
# ALIPAY_APP_PRIVATE_KEY=
#   应用私钥，格式：-----BEGIN PRIVATE KEY-----\n...\n-----END PRIVATE KEY-----
#   来源：支付宝开发者平台 -> 开发设置 -> 接口加签方式
#
# ALIPAY_PUBLIC_KEY=
#   支付宝公钥，格式：-----BEGIN PUBLIC KEY-----\n...\n-----END PUBLIC KEY-----
#   来源：支付宝开发者平台 -> 开发设置 -> 接口加签方式
# ========================================
