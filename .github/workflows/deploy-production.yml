name: Build release artifacts

# 仅构建传统目录制品，不连接生产 ECS。
# AIStar API 的正式包来自 impersonation-ci.yml 的 verified-backend。
# 正式滚动发布入口和验收见 docs/runbooks/aistar-production-release.md。

on:
  workflow_dispatch:
    inputs:
      services:
        description: "Services to build: all, or comma-separated server,web-music,web-drama,web-celebrity,web-aiavatar,admin,sau-service"
        required: true
        default: "all"
      skip_typecheck:
        description: "Skip TypeScript checks"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: 8621320f51348a9ae33b3b4bd500636829320abb

      - name: Set release id
        run: |
          echo "RELEASE_ID=8621320f5134-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Build release artifacts
        env:
          RELEASE_ID: ${{ env.RELEASE_ID }}
          SKIP_TYPECHECK: ${{ inputs.skip_typecheck && '1' || '0' }}
          NEXT_PUBLIC_ENTERPRISE_ENABLED: "1"
          NEXT_PUBLIC_USE_MOCK: "0"
          NEXT_PUBLIC_MIXCUT_USE_REAL: "1"
          NEXT_PUBLIC_SERVER_API_BASE: "http://127.0.0.1:8080"
        run: ./infra/scripts/build-release.sh "${{ inputs.services }}"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: aistareco-release-${{ env.RELEASE_ID }}
          path: dist/deploy/${{ env.RELEASE_ID }}
          if-no-files-found: error
          retention-days: 14
