name: Build release artifacts

# 受控发布（2026-06-22 起）：本 workflow 只「构建 + 上传产物」，不再自动部署到生产。
# 原因：不在 GitHub 放生产 SSH 私钥（长期主钥交给 GitHub 会扩大爆炸半径），改为受控人工发布。
# 实际发布请用：
#   - 本机：./infra/scripts/deploy.sh <services>（或对已构建产物 deploy-release.sh）
#   - ECS 上：sudo ./infra/scripts/update-and-deploy.sh <services>
# dispatch 本 workflow 会产出可下载的 release 产物（Actions run → Artifacts），供受控发布取用。

on:
  workflow_dispatch:
    inputs:
      services:
        description: "Services to build: all, or comma-separated server,web-music,web-drama,web-celebrity,web-aiavatar,admin,sau-service"
        required: true
        default: "all"
      skip_typecheck:
        description: "Skip TypeScript checks"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set release id
        run: |
          echo "RELEASE_ID=${GITHUB_SHA::12}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Build release artifacts
        env:
          RELEASE_ID: ${{ env.RELEASE_ID }}
          SKIP_TYPECHECK: ${{ inputs.skip_typecheck && '1' || '0' }}
          NEXT_PUBLIC_USE_MOCK: "0"
          NEXT_PUBLIC_MIXCUT_USE_REAL: "1"
          NEXT_PUBLIC_SERVER_API_BASE: "http://127.0.0.1:8080"
        run: ./infra/scripts/build-release.sh "${{ inputs.services }}"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: aistareco-release-${{ env.RELEASE_ID }}
          path: dist/deploy/${{ env.RELEASE_ID }}
          if-no-files-found: error
          retention-days: 14
