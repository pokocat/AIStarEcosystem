name: Impersonation CI
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 10 * * 1'
permissions:
  contents: read
concurrency:
  group: impersonation-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.plan.outputs.backend }}
      contract: ${{ steps.plan.outputs.contract }}
      frontend: ${{ steps.plan.outputs.frontend }}
      builds: ${{ steps.plan.outputs.builds }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          # The PR merge commit and its parents include the base tree needed
          # for git diff; fetching the entire asset-heavy history is unnecessary.
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/ci/*.test.mjs
      - name: Select affected checks
        id: plan
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          CI_HEAD_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ -n "$CI_BASE_SHA" ]] && ! git cat-file -e "$CI_BASE_SHA^{commit}" 2>/dev/null; then
            git -c credential.helper='!gh auth git-credential' fetch --no-tags --depth=1 origin "$CI_BASE_SHA"
          fi
          node scripts/ci/affected.mjs
  backend-tests:
    needs: scope
    if: needs.scope.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: apps/server/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare pinned platform SDK
        run: ./infra/scripts/prepare-platform-sdk.sh
      - name: Media test dependencies
        timeout-minutes: 10
        run: |
          packages=()
          command -v ffmpeg >/dev/null || packages+=(ffmpeg)
          command -v fc-list >/dev/null || packages+=(fontconfig)
          if ! command -v fc-list >/dev/null || [[ -z "$(fc-list ':lang=zh' file)" ]]; then
            packages+=(fonts-noto-cjk)
          fi
          if (( ${#packages[@]} )); then
            bash infra/scripts/use-ci-ubuntu-archive.sh
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends "${packages[@]}"
          fi
          ffmpeg -version > /tmp/aistar-ci-ffmpeg-version.txt
          head -n 1 /tmp/aistar-ci-ffmpeg-version.txt
          test -n "$(fc-list ':lang=zh' file)"
      - name: Select backend test shard
        id: tests
        env:
          SHARD: ${{ matrix.shard }}
        run: node scripts/ci/server-tests.mjs plan "$SHARD" "$RUNNER_TEMP/server-tests.json"
      - name: Server test shard and package
        working-directory: apps/server
        env:
          TEST_CLASSES: ${{ steps.tests.outputs.tests }}
        run: ./mvnw -B "-Dtest=$TEST_CLASSES" -DargLine=-Xmx3g -Dspring.test.context.cache.maxSize=2 -DforkCount=1 -DreuseForks=true -Djunit.jupiter.execution.parallel.enabled=false verify
      - name: Verify every selected class produced a report
        run: node scripts/ci/server-tests.mjs verify "$RUNNER_TEMP/server-tests.json" apps/server/target/surefire-reports
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: impersonation-server-tests-${{ matrix.shard }}
          path: apps/server/target/surefire-reports/
          retention-days: 3
  backend:
    needs: [scope, backend-tests, postgres-migration]
    if: always() && needs.scope.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check all backend shards
        env:
          RESULT: ${{ needs.backend-tests.result }}
          POSTGRES_RESULT: ${{ needs.postgres-migration.result }}
        run: test "$RESULT" = success && test "$POSTGRES_RESULT" = success
  postgres-migration:
    needs: [scope, backend-tests]
    if: needs.scope.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: apps/server/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare pinned platform SDK
        run: ./infra/scripts/prepare-platform-sdk.sh
      # All tests were verified by backend-tests shards. This step only packages
      # that same source into one immutable JAR, not a substitute for tests.
      - name: Package the fully tested source
        working-directory: apps/server
        run: ./mvnw -B -DskipTests package
      - name: Compile isolated migration helpers and refusal gates
        working-directory: apps/server
        run: python3 scripts/compile-migration-tools.py
      - name: Cluster release policy refusal tests
        run: python3 infra/scripts/cluster/test_policy.py
      - name: PostgreSQL 18 real database gate
        working-directory: apps/server
        run: ./mvnw -B -Ppostgres-test -Dspring.test.context.cache.maxSize=2 -Dapi.version=1.44 -DforkCount=1 -DreuseForks=true test && python3 scripts/check-postgres-reports.py
      - name: Save verified backend identity
        run: |
          python3 - <<'PYCODE'
          import json,hashlib,os,pathlib,subprocess
          root=pathlib.Path('.');jar=root/'apps/server/target/ai-star-eco-server-1.0.0.jar'
          proof={'sha':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'source_tree':subprocess.check_output(['git','rev-parse','HEAD:apps/server'],text=True).strip(),'jar_sha256':hashlib.sha256(jar.read_bytes()).hexdigest(),'tests_passed':True,'ci_run':os.environ['GITHUB_RUN_ID'],'backend_shards_verified':3,'business_tables':195,'postgres_flyway_version':'79'}
          (jar.parent/'verified-backend.json').write_text(json.dumps(proof,indent=2))
          PYCODE
      - uses: actions/upload-artifact@v4
        with:
          name: verified-backend
          path: |
            apps/server/target/ai-star-eco-server-1.0.0.jar
            apps/server/target/migration-tools/
            apps/server/target/verified-backend.json
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: postgres-migration-tests
          path: apps/server/target/surefire-reports/
          retention-days: 3
  frontend-checks:
    needs: scope
    if: needs.scope.outputs.frontend != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.scope.outputs.frontend) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # One workspace per runner: independent Vitest worker pools no longer
      # compete for the same runner's CPUs. Shared dependencies are source-only.
      - if: matrix.shard < 2
        run: pnpm --filter "${{ matrix.package }}" --if-present typecheck
      - if: matrix.shard == 0
        run: pnpm --filter "${{ matrix.package }}" --if-present test
      - name: Studio test shard
        if: matrix.shard > 0
        env:
          SHARD: ${{ matrix.shard }}
        run: pnpm --filter "${{ matrix.package }}" exec vitest run "--shard=$SHARD/2" --reporter=default --reporter=junit --outputFile="$RUNNER_TEMP/studio-tests.xml"
      - uses: actions/upload-artifact@v4
        if: always() && matrix.shard > 0
        with:
          name: studio-tests-${{ matrix.shard }}
          path: ${{ runner.temp }}/studio-tests.xml
          if-no-files-found: error
          retention-days: 3
  api-contract:
    needs: scope
    if: needs.scope.outputs.contract == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # This scanner uses Node built-ins; installing the workspace is unnecessary.
      - run: node scripts/check-api-contract.mjs
  frontend-tests:
    # Keep a stable check name even when the affected workspace matrix is empty.
    needs: [scope, frontend-checks, api-contract]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check frontend results
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          CHECKS_RESULT: ${{ needs.frontend-checks.result }}
          CONTRACT_RESULT: ${{ needs.api-contract.result }}
        run: |
          test "$SCOPE_RESULT" = success
          for result in "$CHECKS_RESULT" "$CONTRACT_RESULT"; do
            case "$result" in success|skipped) ;; *) exit 1 ;; esac
          done
  build-and-browser:
    needs: scope
    if: needs.scope.outputs.builds != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.scope.outputs.builds) }}
    name: build-and-browser (${{ matrix.product }})
    env:
      NEXT_PUBLIC_USE_MOCK: '0'
      NEXT_PUBLIC_AUTH_MODE: id
      NEXT_PUBLIC_ID_ISSUER: https://id.example.com
      NEXT_PUBLIC_SERVER_API_BASE: http://127.0.0.1:8080
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter "${{ matrix.package }}" build
      - name: Install isolated browser test dependency
        if: matrix.browser || matrix.product == 'web-aiavatar' || matrix.product == 'admin-new'
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-test" --no-package-lock --no-save playwright@1.55.1
          bash infra/scripts/use-ci-ubuntu-archive.sh
          "$RUNNER_TEMP/browser-test/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify stale payment polling preserves server confirmation
        if: matrix.product == 'web-aiavatar'
        run: NODE_PATH="$RUNNER_TEMP/browser-test/node_modules" node scripts/migration/payment-race-browser.cjs
      - name: Verify toast deadlines are released on navigation
        if: matrix.product == 'admin-new'
        run: NODE_PATH="$RUNNER_TEMP/browser-test/node_modules" node scripts/migration/toast-lifecycle-browser.cjs
      - name: Verify handoff and exit in production pages
        if: matrix.browser
        env:
          PRODUCT: ${{ matrix.product }}
        run: |
          pnpm --filter "@ai-star-eco/$PRODUCT" exec next start -p 3800 > /tmp/impersonation-next.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true; cat /tmp/impersonation-next.log' EXIT
          for i in $(seq 1 60); do
            if curl --silent --output /dev/null http://127.0.0.1:3800/; then break; fi
            sleep 1
          done
          NODE_PATH="$RUNNER_TEMP/browser-test/node_modules" node scripts/impersonation/browser.cjs "${PRODUCT#web-}"
      - uses: actions/upload-artifact@v4
        if: always() && (matrix.browser || matrix.product == 'web-aiavatar' || matrix.product == 'admin-new')
        with:
          name: impersonation-browser-${{ matrix.product }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 3
  ci:
    name: CI
    needs: [scope, backend, frontend-tests, build-and-browser]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check all selected jobs
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          BACKEND_RESULT: ${{ needs.backend.result }}
          FRONTEND_RESULT: ${{ needs.frontend-tests.result }}
          BUILD_RESULT: ${{ needs.build-and-browser.result }}
        run: |
          test "$SCOPE_RESULT" = success
          test "$FRONTEND_RESULT" = success
          for result in "$BACKEND_RESULT" "$BUILD_RESULT"; do
            case "$result" in success|skipped) ;; *) exit 1 ;; esac
          done
